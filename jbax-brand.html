<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JBAX Brand System Dashboard</title>
  <meta name="description" content="JB금융그룹 AX 혁신 브랜드 JBAX 브랜드 시스템 대시보드" />
  <link rel="stylesheet" href="./assets/jbax/brand-tokens.css" />
  <style>
    /* 상단 간단 헤더 (앱으로 돌아가기) — 대시보드 자체는 기준 SVG 그대로 */
    .jbax-topbar { display:flex; align-items:center; gap:10px; max-width:1536px; margin:0 auto 14px;
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; }
    .jbax-topbar a { color: var(--jbax-blue); font-size:.86rem; font-weight:700; text-decoration:none; }
    .jbax-topbar .sp { flex:1; }
  </style>
</head>
<body style="margin:0">
  <main class="jbax-brand-section">
    <div class="jbax-topbar">
      <strong style="color:var(--jbax-navy)">JBAX 브랜드 시스템</strong>
      <span class="sp"></span>
      <a href="./">← 맛집 트래커로</a>
    </div>
    <section class="jbax-dashboard-frame" aria-label="JBAX Brand System Dashboard">
      <!-- 중요: 아래 SVG가 최종 기준본입니다. 재작성/재생성 금지. -->
      <img src="./assets/jbax/JBAX_brand_dashboard_EXACT.svg" alt="JBAX Brand System Dashboard" />
    </section>
  </main>
</body>
</html>
