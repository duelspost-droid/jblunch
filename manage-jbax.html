<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>🔒 JB×AX 관리자</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #f5f6fa; color: #1a1a2e; min-height: 100vh; padding: 20px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .app-header {
    background: linear-gradient(100deg, #0a3d7a 0%, #1565c0 100%);
    color: #fff; padding: 16px 20px; border-radius: 14px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .app-header h1 { font-size: 1.05rem; font-weight: 800; }
  .app-header .hl-ax { background: linear-gradient(90deg,#ffd54a,#ffb300); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .app-header a { margin-left: auto; color: #dbe8f7; font-size: 0.8rem; text-decoration: none; }
  .card { background: #fff; border-radius: 16px; padding: 20px; border: 1px solid #eaeef4; box-shadow: 0 1px 3px rgba(20,40,80,0.05); margin-bottom: 16px; }
  .card h2 { font-size: 0.96rem; font-weight: 800; color: #0a3d7a; display: flex; align-items: center; gap: 7px; }
  /* 카드 헤더(제목 + 우측 버튼) */
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 13px; margin-bottom: 15px; border-bottom: 1px solid #eef1f6; }
  .card-head h2 { margin: 0; }
  label { font-size: 0.78rem; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
  input[type=password] {
    width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 10px 12px; font-size: 0.9rem; font-family: inherit; margin-bottom: 12px;
  }
  input:focus { outline: none; border-color: #0a3d7a; }
  .btn { background: #0a3d7a; color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: opacity .12s, background .12s; }
  .btn:hover { opacity: 0.92; }
  /* 보조 버튼: 고스트 스타일 */
  .btn.gray { background: #fff; color: #4a5a72; border: 1.5px solid #dde4ee; padding: 7px 13px; font-size: 0.8rem; font-weight: 700; }
  .btn.gray:hover { background: #f4f7fb; opacity: 1; border-color: #c7d3e3; }
  .msg { font-size: 0.82rem; margin: 6px 0; min-height: 18px; }
  .msg.err { color: #c53030; }
  .msg.ok { color: #2f855a; }
  .stats { background: linear-gradient(160deg,#f4f7fb,#eef3fa); border: 1px solid #e7eef7; border-radius: 12px; padding: 13px 15px; margin-bottom: 14px; font-size: 0.9rem; color: #1e3a5f; }
  .stats b { color: #0a3d7a; }
  .stats .act { font-size: 0.74rem; color: #8794a6; margin-top: 6px; line-height: 1.5; }
  .logs { max-height: 430px; overflow: auto; border: 1px solid #eee; border-radius: 10px; }  /* ≈10행 + 헤더, 내부 스크롤 */
  table { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
  th { position: sticky; top: 0; background: #0a3d7a; color: #fff; padding: 8px; text-align: left; font-weight: 600; }
  td { padding: 6px 9px; border-bottom: 1px solid #f3f3f3; color: #444; vertical-align: top; }
  tbody tr:nth-child(even) { background: #fafbfd; }
  tbody tr:hover { background: #eef4fc; }
  .t-time { white-space: nowrap; color: #999; }
  .t-ip { white-space: nowrap; font-family: monospace; color: #2b6cb0; }
  .t-act { white-space: nowrap; font-weight: 600; }
  .t-geo { white-space: nowrap; color: #2f855a; font-size: 0.74rem; cursor: help; }
  .t-env { white-space: nowrap; color: #555; font-size: 0.74rem; }
  .t-detail { color: #666; word-break: break-all; }
  .hidden { display: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  /* 방문자 통계 그리드 */
  .vstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .vbox {
    background: linear-gradient(160deg,#f4f7fb,#eef3fa); border: 1px solid #e7eef7;
    border-radius: 12px; padding: 13px 10px; text-align: center;
  }
  .vbox .vlabel { font-size: 0.74rem; color: #6b7a90; font-weight: 700; margin-bottom: 6px; }
  .vbox .vnum { font-size: 1.4rem; font-weight: 800; color: #0a3d7a; line-height: 1.1; }
  .vbox .vnum small { font-size: 0.7rem; font-weight: 600; }
  .vbox .vuniq { font-size: 0.7rem; color: #8794a6; margin-top: 4px; }
  .vbox .vuniq b { color: #2b6cb0; }
  /* 방문 추이 그래프 */
  .chart-head { font-size: 0.8rem; font-weight: 700; color: #0a3d7a; margin: 16px 0 8px; }
  .chart { width: 100%; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .bar { fill: #1565c0; transition: fill .12s; }
  .chart .bar:hover { fill: #0a3d7a; }
  .chart .blabel { font-size: 9px; fill: #9aa6b5; }
  .chart .bval { font-size: 9px; fill: #2b6cb0; font-weight: 700; }
  /* 페이지네이션 */
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; }
  .pager button {
    border: 1.5px solid #e2e8f0; background: #fff; color: #0a3d7a; cursor: pointer;
    border-radius: 9px; padding: 7px 14px; font-size: 0.82rem; font-weight: 700;
  }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pager .pinfo { font-size: 0.8rem; color: #667; font-weight: 600; }
  /* 로그 검색 */
  .toolbar { background: #f7f9fc; border: 1px solid #eef1f6; border-radius: 12px; padding: 11px 12px; margin-bottom: 12px; }
  .log-filter { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1.5px solid #d8e2ee; border-radius: 9px; overflow: hidden; }
  .seg button { border: none; background: #fff; color: #6b7a8d; font-size: 0.82rem; font-weight: 600; padding: 7px 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid #e2e8f0; }
  .seg button.on { background: #0a3d7a; color: #fff; }
  .range-inputs { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: #888; }
  .range-inputs input { border: 1.5px solid #e2e8f0; border-radius: 8px; padding: 6px 8px; font-size: 0.82rem; font-family: inherit; }
  #action-sel { border: 1.5px solid #d8e2ee; border-radius: 9px; padding: 7px 10px; font-size: 0.82rem; font-family: inherit; color: #333; background: #fff; cursor: pointer; }
  .log-search { display: flex; gap: 8px; margin-bottom: 12px; }
  .log-search input {
    flex: 1; border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 9px 12px; font-size: 0.85rem; font-family: inherit;
  }
  .log-search input:focus { outline: none; border-color: #0a3d7a; }
  .log-search .btn { padding: 9px 14px; }

  /* ── 모바일 반응형 ────────────────────────────────── */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .vstats { grid-template-columns: repeat(2, 1fr); }
    .vbox .vnum { font-size: 1.25rem; }
    .app-header { padding: 13px 15px; border-radius: 12px; margin-bottom: 14px; }
    .app-header h1 { font-size: 0.98rem; }
    .card { padding: 14px; border-radius: 12px; }
    /* iOS 자동확대 방지 */
    input[type=password], input[type=text] { font-size: 16px; }
    .btn { padding: 11px 16px; }
    .row { gap: 8px; }
    .logs { max-height: 65vh; overflow: auto; border: 1px solid #eee; }  /* 모바일도 내부 스크롤(스크롤 안 스크롤 허용) */
    /* 테이블 → 카드형 변환 */
    table, thead, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    table { font-size: 0.8rem; }
    tbody tr {
      background: #fff; border: 1px solid #eef1f5; border-radius: 10px;
      padding: 7px 11px; margin-bottom: 7px; box-shadow: 0 1px 2px rgba(20,40,80,0.04);
    }
    tbody td {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 1.5px 0; border: none; white-space: normal; text-align: right;
    }
    tbody td::before {
      content: attr(data-label); color: #9aa6b5; font-weight: 700;
      font-size: 0.7rem; flex-shrink: 0; text-align: left;
    }
    .t-detail { word-break: break-all; }
    .t-detail.t-empty { display: none; }   /* 빈 상세 줄 숨김 → 카드 높이 축소 */
    tbody td[colspan] { justify-content: center; }
    tbody td[colspan]::before { content: ''; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-header">
    <span>🔒</span>
    <h1>JB<span class="hl-ax">×AX</span> 관리자</h1>
    <a href="./">← 사이트로</a>

    <div class="card">
      <div class="card-head">
        <h2>👥 방문자 통계</h2>
        <button class="btn gray" onclick="logout()">로그아웃</button>

      <div class="toolbar">

          <div class="seg" id="period-seg">

            <button data-period="month" onclick="setPeriod('month')">월</button>
            <button data-period="range" onclick="setPeriod('range')">기간</button>

          </div>
          <select id="action-sel" onchange="onFilterChange()">
            <option value="">전체 액션</option>
            <option value="visit">방문(visit)</option>
            <option value="custom_recommend">맞춤추천(custom_recommend)</option>
            <option value="nearby">주변목록(nearby)</option>
            <option value="place_search">주변검색(place_search)</option>
            <option value="review_create">리뷰작성(review_create)</option>
            <option value="review_edit">리뷰수정(review_edit)</option>
            <option value="review_delete">리뷰삭제(review_delete)</option>
            <option value="admin_login">관리자로그인(admin_login)</option>

            <option value="admin_pw_change">비번변경(admin_pw_change)</option>

                 oninput="applyLogSearch()">

      <div class="logs" id="logs"></div>

<script>
const SB_URL = 'https://nrdapzgtibbusvoaceuh.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yZGFwemd0aWJidXN2b2FjZXVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDM2MTEsImV4cCI6MjA5NTQ3OTYxMX0.hzAnNaPdx1AaswsY1hkzc98aRSD2PXUjVi_mLl3bzcM';
const ADMIN_URL = `${SB_URL}/functions/v1/admin`;
let curToken = '';   // 세션 토큰 (비밀번호는 저장하지 않음)
let allLogs = [];      // 서버에서 받은(필터 적용) 로그
let logPage = 0;       // 현재 페이지 (0-base)
let logQuery = '';     // 추가 텍스트 검색
const PAGE_SIZE = 10;  // 한 페이지 로그 수
let logFilter = { period: 'all', action: '', from: '', to: '' };  // 기간·액션 필터

// 기간 버튼: 서버 왕복 없이 클라이언트에서 즉시 필터
function setPeriod(p){
  logFilter.period = p;
  document.querySelectorAll('#period-seg button').forEach(b => b.classList.toggle('on', b.dataset.period === p));
  document.getElementById('range-inputs').style.display = (p === 'range') ? 'inline-flex' : 'none';
  onFilterChange();
}
function readFilterInputs(){
  logFilter.action = document.getElementById('action-sel').value || '';
  logFilter.from = document.getElementById('from-date').value || '';
  logFilter.to = document.getElementById('to-date').value || '';
}
function onFilterChange(){
  readFilterInputs();
  if (logFilter.period === 'range' && (!logFilter.from || !logFilter.to)) return;  // 기간모드는 날짜 둘 다 필요
  refreshLogView();
}
// 서버 재조회(수동 새로고침용) — 필터는 클라이언트에서 처리
async function applyFilter(){ onFilterChange(); }

// KST 기준 경계(ms)
function kstStartMs(period){
  const k = new Date(Date.now() + 9*3600000);
  const y=k.getUTCFullYear(), m=k.getUTCMonth(), d=k.getUTCDate();
  if(period==='day')   return Date.UTC(y,m,d) - 9*3600000;
  if(period==='month') return Date.UTC(y,m,1) - 9*3600000;
  return null;
}
function kstDayStartMs(ds){ const [a,b,c]=ds.split('-').map(Number); return Date.UTC(a,b-1,c) - 9*3600000; }

// 기간·액션·기간범위·검색어를 모두 클라이언트에서 적용
function getFilteredLogs(){
  let list = allLogs;
  const p = logFilter.period;
  if(p==='day' || p==='month'){
    const s = kstStartMs(p);
    list = list.filter(l => new Date(l.created_at).getTime() >= s);
  } else if(p==='range' && logFilter.from && logFilter.to){
    const f = kstDayStartMs(logFilter.from), t = kstDayStartMs(logFilter.to) + 86400000;
    list = list.filter(l => { const x = new Date(l.created_at).getTime(); return x>=f && x<t; });
  }
  if(logFilter.action) list = list.filter(l => l.action === logFilter.action);
  const q = logQuery.trim().toLowerCase();
  if(q) list = list.filter(l=>{
    const e = parseUA(l.user_agent);
    const hay = [l.ip, l.action, l.detail, e.os, e.browser, l.user_agent, geoSearchStr(l.geo), fmt(l.created_at)]
      .map(x=>String(x||'').toLowerCase()).join(' ');
    return hay.includes(q);
  });
  return list;
}
// 필터 결과로 통계 + 로그 목록 갱신
function refreshLogView(){
  const list = getFilteredLogs();
  const pLabel = { day:'오늘', month:'이번 달', range:'기간', all:'전체' }[logFilter.period] || '전체';
  const aLabel = logFilter.action ? ` · 액션: ${esc(logFilter.action)}` : '';
  const ipSet = new Set(), actCount = {}, regCount = {};
  list.forEach(l=>{
    if(l.ip) ipSet.add(l.ip);
    actCount[l.action] = (actCount[l.action]||0)+1;
    if(l.geo){ const lab=[l.geo.country,l.geo.region].filter(Boolean).join(' ')||l.geo.country||'기타'; regCount[lab]=(regCount[lab]||0)+1; }
  });
  const acts = Object.entries(actCount).map(([k,v])=>`${esc(k)} ${v}`).join(' · ');
  const regions = Object.entries(regCount).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`${esc(k)} ${v}`).join(' · ');
  document.getElementById('stats').innerHTML =
    `<div>📅 ${pLabel}${aLabel} — <b>${list.length}</b>건 (전체 ${allLogs.length}) · 고유 IP <b>${ipSet.size}</b></div><div class="act">${acts}</div>`+
    (regions?`<div class="act">📍 ${regions}</div>`:'');
  renderLogPage();
}
function applyLogSearch(){
  logQuery = document.getElementById('logq').value || '';
  document.getElementById('logq-clear').style.display = logQuery ? '' : 'none';
  refreshLogView();
}
function clearLogSearch(){
  logQuery = '';
  const inp = document.getElementById('logq'); if(inp) inp.value = '';
  document.getElementById('logq-clear').style.display = 'none';
  refreshLogView();
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// User-Agent → 기기/브라우저 추출
function parseUA(ua){
  ua = ua || '';
  if(!ua) return { os:'알수없음', browser:'-', emoji:'❓' };
  let browser='기타';
  if(/KAKAOTALK/i.test(ua)) browser='카카오톡';
  else if(/NAVER\(inapp|NAVER\//i.test(ua)) browser='네이버앱';
  else if(/Instagram/i.test(ua)) browser='인스타그램';
  else if(/Edg(A|iOS|)?\//i.test(ua)) browser='Edge';
  else if(/SamsungBrowser/i.test(ua)) browser='삼성인터넷';
  else if(/Whale/i.test(ua)) browser='웨일';
  else if(/FxiOS|Firefox/i.test(ua)) browser='Firefox';
  else if(/CriOS|Chrome/i.test(ua)) browser='Chrome';
  else if(/Safari/i.test(ua)) browser='Safari';
  let os='기타', emoji='🖥️';
  if(/iPhone/i.test(ua)){ os='iPhone'; emoji='📱'; }
  else if(/iPad/i.test(ua)){ os='iPad'; emoji='📲'; }
  else if(/Android/i.test(ua)){ os = /Mobile/i.test(ua)?'Android폰':'Android태블릿'; emoji='📱'; }
  else if(/Windows/i.test(ua)){ os='Windows'; emoji='💻'; }
  else if(/Macintosh|Mac OS X/i.test(ua)){ os='Mac'; emoji='💻'; }
  else if(/Linux/i.test(ua)){ os='Linux'; emoji='💻'; }
  return { os, browser, emoji };
}
// 항상 KST(한국 시간) 기준으로 표시 — 기기 시간대와 무관하게 일관
function fmt(iso){ if(!iso) return ''; const d=new Date(new Date(iso).getTime()+9*3600000); const p=n=>String(n).padStart(2,'0'); return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`; }

// 국가코드 → 국기 이모지
function flag(cc){ if(!cc||cc.length!==2) return '🌐'; return String.fromCodePoint(...[...cc.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65)); }
// geo 객체 → 짧은 지역 라벨
function geoLabel(g){
  if(!g) return '';
  const parts = [g.city, g.region].filter(Boolean);
  const place = [...new Set(parts)].join(' ') || g.country || '';
  return `${flag(g.country_code)} ${esc(place||'알수없음')}`;
}
// geo 객체 → 상세(hover) 텍스트
function geoTitle(g){
  if(!g) return '사설/로컬 IP — 지역 조회 불가';
  const t = [
    [g.country, g.region, g.city].filter(Boolean).join(' › '),
    g.isp ? `ISP: ${g.isp}` : '',
    g.mobile ? '📶 모바일망' : '', g.proxy ? '🛡️ VPN/프록시 의심' : ''
  ].filter(Boolean).join('\n');
  return t;
}
function geoSearchStr(g){ return g ? [g.country,g.region,g.city,g.isp].filter(Boolean).join(' ') : ''; }

async function adminCall(payload){
  const res = await fetch(ADMIN_URL, {
    method:'POST',
    headers:{ 'Authorization':`Bearer ${SB_KEY}`, 'Content-Type':'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await res.json().catch(()=>({}));
  return { ok: res.ok, data };
}

const SESSION_KEY = 'jbadm';

function showPanel(){
  document.getElementById('login-card').classList.add('hidden');
  document.getElementById('loading-card').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
}
function showLoginCard(){
  document.getElementById('loading-card').classList.add('hidden');
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('login-card').classList.remove('hidden');
}

async function login(){
  const pw = document.getElementById('pw').value;
  const msg = document.getElementById('login-msg');
  if(!pw){ msg.className='msg err'; msg.textContent='비밀번호를 입력하세요.'; return; }
  msg.className='msg'; msg.textContent='확인 중…';
  const { ok, data } = await adminCall({ action:'login', password: pw, limit: 1000 });
  if(!ok){ msg.className='msg err'; msg.textContent='⚠️ '+(data.error||'로그인 실패'); return; }
  curToken = data.token || '';
  try { localStorage.setItem(SESSION_KEY, curToken); } catch(e) {}  // 비번 대신 토큰 저장
  document.getElementById('pw').value = '';
  showPanel();
  render(data);
}

// 새로고침 시 저장된 토큰으로 자동 재로그인
async function restoreSession(){
  let token = '';
  try { token = localStorage.getItem(SESSION_KEY) || ''; } catch(e) {}
  if(!token){ showLoginCard(); return; }
  const { ok, data } = await adminCall({ action:'logs', token, limit: 1000 });
  if(ok){ curToken = token; showPanel(); render(data); }
  else { try { localStorage.removeItem(SESSION_KEY); } catch(e) {} showLoginCard(); }
}

async function logout(){
  try { if(curToken) await adminCall({ action:'logout', token: curToken }); } catch(e) {}
  curToken = '';
  try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
  showLoginCard();
  document.getElementById('pw').value = '';
  const m = document.getElementById('login-msg'); if(m){ m.className='msg'; m.textContent=''; }
}

async function loadLogs(){
  if(!curToken) return;
  const { ok, data } = await adminCall({ action:'logs', token: curToken, limit: 1000 });
  if(ok) render(data);
  else { logout(); }
}

function render(data){
  // 로그 원본 저장 → 필터는 클라이언트에서 처리
  allLogs = data.logs || [];
  // 방문자 통계 (일/월/연/전체)
  const v = data.visits || {};
  const u = v.unique || {};
  const box = (label, n, uniq) => `<div class="vbox">
    <div class="vlabel">${label}</div>
    <div class="vnum">${(n||0).toLocaleString()}<small>회</small></div>
    <div class="vuniq">고유 <b>${(uniq||0).toLocaleString()}</b></div></div>`;
  const vEl = document.getElementById('vstats');
  if (vEl) vEl.innerHTML =
    box('오늘', v.day, u.day) + box('이번 달', v.month, u.month) +
    box('올해', v.year, u.year) + box('전체', v.total, u.total);
  renderChart(v.daily || []);
  // 통계 + 로그 목록(현재 필터 기준)
  refreshLogView();
}

// 방문 추이 막대그래프 (의존성 없는 인라인 SVG)
function renderChart(daily){
  const el = document.getElementById('chart');
  if (!el) return;
  if (!daily.length){ el.innerHTML = '<div style="color:#aaa;font-size:0.8rem">데이터 없음</div>'; return; }
  const W = 700, H = 150, padB = 22, padT = 16, n = daily.length;
  const max = Math.max(1, ...daily.map(d=>d.count));
  const gap = 6, bw = (W - gap*(n-1)) / n;
  const bars = daily.map((d,i)=>{
    const h = Math.round((H - padB - padT) * d.count / max);
    const x = i*(bw+gap), y = H - padB - h;
    const val = d.count>0 ? `<text class="bval" x="${x+bw/2}" y="${y-3}" text-anchor="middle">${d.count}</text>` : '';
    return `<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${h}" rx="3"><title>${d.date}: ${d.count}회</title></rect>
      ${val}<text class="blabel" x="${x+bw/2}" y="${H-7}" text-anchor="middle">${d.date}</text>`;
  }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}

// 한 화면에서 10개씩 무한 스크롤로 누적 표시
let logShown = 0;          // 현재까지 화면에 그린 행 수
let _logScrollBound = false;
function rowHtml(l){
  const e = parseUA(l.user_agent);
  const gl = geoLabel(l.geo);
  return `
    <tr><td class="t-time" data-label="시간">${fmt(l.created_at)}</td><td class="t-ip" data-label="IP">${esc(l.ip)}</td>
    <td class="t-geo${l.geo?'':' t-empty'}" data-label="지역" title="${esc(geoTitle(l.geo))}">${gl||'-'}</td>
    <td class="t-env" data-label="기기·브라우저" title="${esc(l.user_agent||'')}">${e.emoji} ${esc(e.os)} · ${esc(e.browser)}</td>
    <td class="t-act" data-label="액션">${esc(l.action)}</td><td class="t-detail${l.detail?'':' t-empty'}" data-label="상세">${esc(l.detail)}</td></tr>`;
}
// 필터 변경/검색 시: 표 초기화 후 첫 10개 렌더
function renderLogPage(){
  const list = getFilteredLogs();
  document.getElementById('logs').innerHTML =
    `<table><thead><tr><th>시간</th><th>IP</th><th>지역</th><th>기기·브라우저</th><th>액션</th><th>상세</th></tr></thead>
     <tbody id="log-tbody"></tbody></table>`;
  logShown = 0;
  if(!list.length){
    const empty = logQuery ? `'${esc(logQuery)}' 검색 결과 없음` : '기록 없음';
    document.getElementById('log-tbody').innerHTML = `<tr><td colspan="6" style="padding:14px;color:#aaa">${empty}</td></tr>`;
  } else {
    appendLogRows();
  }
  document.getElementById('logs').scrollTop = 0;
  bindLogScroll();
  updateLogFooter(list);
}
// 다음 10개 행을 tbody에 누적
function appendLogRows(){
  const list = getFilteredLogs();
  const tb = document.getElementById('log-tbody');
  if(!tb || logShown >= list.length) return;
  const next = list.slice(logShown, logShown + PAGE_SIZE);
  tb.insertAdjacentHTML('beforeend', next.map(rowHtml).join(''));
  logShown += next.length;
  updateLogFooter(list);
  // PC: 컨테이너가 아직 스크롤 불가하면 채워질 때까지 더 로드
  const el = document.getElementById('logs');
  if(el && getComputedStyle(el).overflowY !== 'visible' && el.scrollHeight <= el.clientHeight && logShown < list.length){
    appendLogRows();
  }
}
function updateLogFooter(list){
  const total = (list||getFilteredLogs());
  const countLabel = logQuery ? `검색 ${total.length}건 / 전체 ${allLogs.length}` : `총 ${allLogs.length}건`;
  const more = logShown < total.length ? ` · 아래로 스크롤하면 더 보기 (${logShown}/${total.length})` : (total.length?' · 끝':'');
  document.getElementById('pager').innerHTML = total.length ? `<span class="pinfo">${countLabel}${more}</span>` : '';
}
// 스크롤이 하단 근처면 다음 10개 로드 (PC=컨테이너 스크롤 / 모바일=페이지 스크롤)
function nearBottom(){
  const el = document.getElementById('logs');
  if(!el) return false;
  if(getComputedStyle(el).overflowY === 'visible'){       // 모바일: 페이지가 스크롤
    return el.getBoundingClientRect().bottom <= window.innerHeight + 200;
  }
  return el.scrollTop + el.clientHeight >= el.scrollHeight - 60;
}
function bindLogScroll(){
  if(_logScrollBound) return;
  const el = document.getElementById('logs');
  if(!el) return;
  const onScroll = ()=>{ if(nearBottom()) appendLogRows(); };
  el.addEventListener('scroll', onScroll);
  window.addEventListener('scroll', onScroll);
  _logScrollBound = true;
}

async function changePw(){
  const cpw = document.getElementById('cpw').value;
  const np1 = document.getElementById('np1').value;
  const np2 = document.getElementById('np2').value;
  const msg = document.getElementById('pw-msg');
  if(!cpw){ msg.className='msg err'; msg.textContent='현재 비밀번호를 입력하세요.'; return; }
  if(np1.length < 6){ msg.className='msg err'; msg.textContent='새 비밀번호는 6자 이상이어야 합니다.'; return; }
  if(np1 !== np2){ msg.className='msg err'; msg.textContent='새 비밀번호가 일치하지 않습니다.'; return; }
  msg.className='msg'; msg.textContent='변경 중…';
  const { ok, data } = await adminCall({ action:'change_password', token: curToken, currentPassword: cpw, newPassword: np1 });
  if(!ok){ msg.className='msg err'; msg.textContent='⚠️ '+(data.error||'변경 실패'); return; }
  curToken = data.token || curToken;   // 비번 변경 시 새 토큰 발급(기존 세션 무효화)
  try { localStorage.setItem(SESSION_KEY, curToken); } catch(e) {}
  document.getElementById('cpw').value=''; document.getElementById('np1').value=''; document.getElementById('np2').value='';
  msg.className='msg ok'; msg.textContent='✅ 비밀번호가 변경되었습니다. (다른 기기는 재로그인 필요)';
}

// 페이지 로드 시 자동 재로그인 시도
restoreSession();
