<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JB 맛집 트래커</title>
<style>
  html,body{margin:0;height:100%;background:#0a3d7a;color:#fff;
    font-family:-apple-system,'Noto Sans KR',sans-serif;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  .logo{font-size:1.4rem;font-weight:900;background:#fff;color:#0a3d7a;
    width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center}
  .sp{width:26px;height:26px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;
    border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="logo">JB</div>
  <div>맛집 트래커 불러오는 중…</div>
  <div class="sp"></div>
  <!-- server.url(라이브 사이트)이 설정되어 있어 실제로는 원격 페이지가 로드됩니다.
       네트워크 불가 시 이 화면이 폴백으로 표시됩니다. -->
</body>
</html>
