name: Daily Lunch Recommendation

on:
  schedule:
    - cron: '0 2 * * 1-5'  # 매일(평일) 오전 11:00 KST (= 02:00 UTC)
  workflow_dispatch:

jobs:
  generate-recommendation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate lunch recommendations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/generate_lunch.py

      - name: Commit and push (GitHub Pages 자동 배포)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add history.json index.html
          git diff --staged --quiet || git commit -m "🍽️ $(TZ=Asia/Seoul date +'%Y-%m-%d') 점심 맛집 추천 업데이트"
          git push
          echo "✅ 배포 완료"
          echo "🌐 https://duelspost-droid.github.io/jblunch/"
