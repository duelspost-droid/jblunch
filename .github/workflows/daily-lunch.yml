name: Daily Lunch Recommendation

on:
  schedule:
    - cron: '10 16 * * 0-4'  # 매일(평일) 새벽 01:10 KST (= 전날 16:10 UTC) — 새벽엔 큐 부하 적어 지연↓
  workflow_dispatch:

jobs:
  generate-recommendation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate lunch recommendations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/generate_lunch.py

      - name: Commit and push (GitHub Pages 자동 배포)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add history.json index.html
          git diff --staged --quiet || git commit -m "🍽️ $(TZ=Asia/Seoul date +'%Y-%m-%d') 점심 맛집 추천 업데이트"
          git push
          echo "✅ 배포 완료"
          echo "🌐 https://duelspost-droid.github.io/jblunch/"

      - name: 카카오톡 발송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python scripts/kakao_send.py
