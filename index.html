<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ JB×AX 맛집 트래커</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #f5f6fa;
    color: #1a1a2e;
    min-height: 100vh;
  }
  .app-header {
    background: linear-gradient(100deg, #0a3d7a 0%, #1565c0 100%);
    padding: 15px 18px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 10px rgba(10,61,122,0.18);
  }
  .app-header .logo {
    font-size: 0.95rem; font-weight: 900; letter-spacing: 0.5px;
    background: #fff; color: #0a3d7a;
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .app-header .title-block h1 { font-size: 1.08rem; font-weight: 800; color: #fff; letter-spacing: -0.2px; }
  .app-header .title-block h1 .hl-ax {
    background: linear-gradient(90deg, #ffd54a, #ffb300);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900; letter-spacing: 0;
  }
  .app-header .title-block p { font-size: 0.74rem; color: rgba(255,255,255,0.8); margin-top: 2px; }
  .sync-badge {
    margin-left: auto;
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }
  .sync-badge.ok { background: #c6f6d5; color: #22543d; }
  .sync-badge.loading { background: #ebf8ff; color: #2b6cb0; }
  .sync-badge.err { background: #fff5f5; color: #c53030; }

  .tabs {
    display: flex;
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 0 16px;
  }
  .tab {
    padding: 11px 16px;
    border: none;
    background: none;
    font-size: 0.86rem;
    font-weight: 500;
    color: #aaa;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }
  .tab.active { color: #0a3d7a; border-bottom-color: #0a3d7a; }

  .content { padding: 14px; max-width: 640px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }

  /* PC 반응형: 넓은 화면에서 폭 확대 + 카드 2단 */
  @media (min-width: 900px) {
    .content { max-width: 1000px; padding: 18px 24px; }
    .section .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; align-items: start; }
    /* 상단 영역도 카드와 같은 전체 폭으로 정렬 (가운데 몰림 방지) */
    .top-banner, .meal-info, .pref-card { max-width: 100%; }
    .meal-toggle { max-width: 560px; }   /* 토글 버튼만 과도하게 넓어지지 않게 살짝 제한(좌측 정렬) */
    .tabs { padding: 0 24px; }
  }

  .sub-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .sub-tab {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid #e2e8f0;
    background: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    color: #aaa;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sub-tab.active { background: #0a3d7a; border-color: #0a3d7a; color: #fff; }

  .date-group { margin-bottom: 22px; }
  .date-label {
    font-size: 0.74rem;
    font-weight: 700;
    color: #999;
    letter-spacing: 0.05em;
    margin-bottom: 9px;
  }
  .weather-comment {
    background: linear-gradient(135deg, #eef4fb, #e3eef9);
    border-left: 3px solid #0a3d7a;
    border-radius: 10px;
    padding: 10px 13px;
    margin-bottom: 10px;
    font-size: 0.82rem;
    color: #555;
    line-height: 1.5;
  }
  .cards { display: flex; flex-direction: column; gap: 9px; }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 13px 13px 13px 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    gap: 0;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .card:hover { box-shadow: 0 3px 14px rgba(0,0,0,0.1); }
  .card-stripe {
    width: 4px;
    flex-shrink: 0;
    background: #e2e8f0;
    margin-right: 11px;
  }
  .card.visited .card-stripe { background: #48bb78; }

  .card-emoji { font-size: 1.6rem; flex-shrink: 0; margin-right: 9px; align-self: flex-start; padding-top: 2px; }
  .card-body { flex: 1; min-width: 0; }
  .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .card-name { font-weight: 700; font-size: 0.95rem; }
  .badge { font-size: 0.67rem; padding: 2px 7px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .badge-cuisine { background: #ebf4ff; color: #2b6cb0; }
  .badge-review { background: #fff4d6; color: #b7791f; }
  .badge-tag { background: #ede9fe; color: #6b46c1; }
  .extra-head {
    font-size: 0.8rem; font-weight: 700; color: #6b46c1;
    margin: 16px 0 9px; padding-top: 13px;
    border-top: 1px dashed #e2e2ea;
  }
  .card.card-extra { background: #faf9ff; }
  .card.card-extra .card-stripe { background: #b794f4; }
  .card.has-review .card-stripe { background: #f6b73c; }
  .modal-intro {
    background: #f0f5fb; border-radius: 10px; padding: 12px 14px;
    font-size: 0.88rem; color: #44566b; line-height: 1.55; margin-bottom: 12px;
  }
  /* 모달 상단 맛집 상세 정보 */
  .modal-detail {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
  }
  .modal-detail .md-chip {
    font-size: 0.78rem; padding: 5px 11px; border-radius: 20px;
    background: #f4f7fb; color: #44566b; font-weight: 600;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .modal-detail .md-map {
    margin-left: auto; font-size: 0.78rem; padding: 5px 12px; border-radius: 20px;
    border: 1.5px solid #03c75a; background: #fff; color: #03c75a;
    text-decoration: none; font-weight: 600;
  }
  .modal-detail .md-map.nomap { border-color: #d0d0d0; background: #f3f3f3; color: #999; }
  .modal-reviews {
    margin-bottom: 16px; max-height: 42vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    background: #f7f9fc; border: 1px solid #e9eef5; border-radius: 14px;
    padding: 14px;
  }
  .modal-reviews .mr-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 0.92rem; font-weight: 800; color: #0a3d7a;
    padding-bottom: 10px; margin-bottom: 2px; border-bottom: 1.5px solid #e3eaf3;
  }
  .modal-reviews .mr-head .mr-avg {
    margin-left: auto; font-size: 0.82rem; font-weight: 700; color: #d69e2e;
    background: #fff7e6; border: 1px solid #f5e3b8; border-radius: 20px; padding: 3px 10px;
  }
  .modal-reviews .review-item {
    background: #fff; border: 1px solid #edf1f6; border-radius: 11px;
    padding: 11px 13px; box-shadow: 0 1px 2px rgba(20,40,80,0.03);
  }
  .modal-reviews .review-name { font-size: 0.86rem; }
  .modal-reviews .review-content {
    font-size: 0.87rem; color: #3a4658; line-height: 1.55; margin-top: 4px;
  }
  .modal-reviews .review-stars { font-size: 0.82rem; }
  /* 리뷰 작성 섹션 */
  .modal-write {
    border-top: 2px dashed #e2e8f0; padding-top: 16px; margin-top: 4px;
  }
  .modal-write .mw-head {
    font-size: 0.92rem; font-weight: 800; color: #0a3d7a; margin-bottom: 12px;
  }
  .modal-row { display: flex; gap: 10px; }
  .modal-row .mf-name { flex: 1; margin-bottom: 11px; }
  .modal-row .mf-stars { flex-shrink: 0; margin-bottom: 11px; }

  .card-feature { font-size: 0.81rem; color: #555; margin-bottom: 6px; line-height: 1.5; }
  .card-meta { display: flex; gap: 11px; font-size: 0.75rem; color: #999; flex-wrap: wrap; }

  /* 다중 리뷰 블록 */
  .reviews-block {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f3f3f3;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .review-item {
    background: #fafafa;
    border-radius: 9px;
    padding: 8px 10px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    position: relative;
  }
  .review-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #0a3d7a;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .review-right { flex: 1; min-width: 0; }
  .review-header { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; flex-wrap: wrap; }
  .review-name { font-size: 0.8rem; font-weight: 700; color: #333; }
  .review-stars { font-size: 0.75rem; }
  .review-date { font-size: 0.68rem; color: #bbb; }
  .review-content { font-size: 0.8rem; color: #555; line-height: 1.5; }
  .btn-del-review {
    background: none;
    border: none;
    cursor: pointer;
    color: #ccc;
    font-size: 0.85rem;
    padding: 2px 4px;
    border-radius: 4px;
    flex-shrink: 0;
    transition: color 0.13s, background 0.13s;
    line-height: 1;
  }
  .btn-del-review:hover { color: #e53e3e; background: #fff0f0; }
  .review-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .btn-edit-review {
    background: none; border: none; cursor: pointer; color: #bbb;
    font-size: 0.8rem; padding: 2px 4px; border-radius: 4px;
    transition: color 0.13s, background 0.13s; line-height: 1;
  }
  .btn-edit-review:hover { color: #0a3d7a; background: #eef4fb; }
  .no-reviews { font-size: 0.76rem; color: #ccc; padding: 2px 0; }

  .card-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    flex-shrink: 0;
    padding-left: 9px;
    align-self: flex-start;
    padding-top: 2px;
  }
  .btn-review {
    font-size: 0.71rem;
    padding: 5px 9px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
    transition: all 0.13s;
    border: 1.5px solid #0a3d7a; background: #fff; color: #0a3d7a;
  }
  .btn-review:hover { background: #0a3d7a; color: #fff; }
  .btn-map {
    font-size: 0.71rem;
    padding: 5px 9px;
    border-radius: 8px;
    font-weight: 600;
    white-space: nowrap;
    transition: all 0.13s;
    border: 1.5px solid #03c75a; background: #fff; color: #03c75a;
    text-decoration: none; display: inline-block; text-align: center;
  }
  .btn-map:hover { background: #03c75a; color: #fff; }
  .btn-map.nomap {
    border-color: #d0d0d0; background: #f3f3f3; color: #999;
    cursor: default;
  }
  .btn-map.nomap:hover { background: #f3f3f3; color: #999; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  @media(min-width:400px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-num { font-size: 1.8rem; font-weight: 800; color: #0a3d7a; line-height: 1; }
  .stat-label { font-size: 0.72rem; color: #999; margin-top: 4px; }

  /* 내 근처 맛집 검색 */
  .place-search-card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 14px; }
  .place-head-row { display: flex; align-items: center; justify-content: space-between; }
  .place-refresh { background: none; border: none; cursor: pointer; font-size: 1rem; padding: 2px 6px; border-radius: 8px; }
  .place-refresh:hover { background: #f0f5fb; }
  .place-search-row { display: flex; gap: 8px; margin-top: 10px; }
  .place-input {
    flex: 1; border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 9px 12px; font-size: 0.86rem; font-family: inherit; color: #333;
  }
  .place-input:focus { outline: none; border-color: #0a3d7a; }
  .place-btn {
    background: #0a3d7a; color: #fff; border: none; border-radius: 10px;
    padding: 9px 16px; font-size: 0.86rem; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .place-hint { font-size: 0.78rem; color: #aaa; padding: 12px 2px 2px; line-height: 1.5; }
  .place-nearby-btn {
    width: 100%; margin-top: 12px; padding: 13px 0;
    background: linear-gradient(100deg, #0a3d7a, #1565c0); color: #fff;
    border: none; border-radius: 12px; font-size: 0.92rem; font-weight: 700;
    cursor: pointer; box-shadow: 0 2px 8px rgba(10,61,122,0.22);
    transition: opacity 0.13s;
  }
  .place-nearby-btn:hover { opacity: 0.92; }
  .place-origin { font-size: 0.74rem; color: #0a3d7a; font-weight: 600; padding: 10px 2px 4px; }
  .place-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 4px; border-bottom: 1px solid #f3f3f3;
  }
  .place-item:last-child { border-bottom: none; }
  .place-info { flex: 1; min-width: 0; cursor: pointer; }
  .place-name { font-weight: 700; font-size: 0.88rem; margin-bottom: 2px; }
  .src-badge { font-size: 0.64rem; padding: 1px 6px; border-radius: 9px; font-weight: 700; vertical-align: middle; }
  .src-badge.src-kakao { background: #fee500; color: #3a1d1d; }
  .src-badge.src-naver { background: #03c75a; color: #fff; }
  .place-sub { font-size: 0.76rem; color: #777; }
  .place-addr { font-size: 0.72rem; color: #aaa; margin-top: 2px; }
  .place-review-btn {
    flex-shrink: 0; border: 1.5px solid #0a3d7a; background: #fff; color: #0a3d7a;
    border-radius: 9px; padding: 7px 12px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    transition: all 0.13s;
  }
  .place-review-btn:hover { background: #0a3d7a; color: #fff; }
  .top-list { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .top-list h3 { font-size: 0.88rem; font-weight: 700; margin-bottom: 11px; }
  .top-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 8px; border-bottom: 1px solid #f5f5f5; cursor: pointer; border-radius: 8px; transition: background 0.13s; }
  .top-item:hover { background: #f0f5fb; }
  .top-item:last-child { border-bottom: none; }
  .top-rank { font-size: 1rem; font-weight: 800; color: #0a3d7a; width: 20px; text-align: center; padding-top: 1px; }
  .top-info { flex: 1; min-width: 0; }
  .top-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
  .top-stars-inline { font-size: 0.74rem; font-weight: 500; color: #f0a020; white-space: nowrap; }
  .top-stars-inline small { color: #aaa; }
  .top-cuisine { font-size: 0.74rem; color: #2b6cb0; font-weight: 600; }
  .top-feature {
    font-size: 0.78rem; color: #666; line-height: 1.45; margin: 3px 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; text-overflow: ellipsis;
  }
  .top-meta { display: flex; gap: 11px; font-size: 0.73rem; color: #999; flex-wrap: wrap; }
  .top-stars { font-size: 0.82rem; }

  .skeleton { background: #eee; border-radius: 8px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* 리뷰 작성 모달 */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  @media(min-width:480px) { .modal-bg { align-items: center; } }
  .modal {
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px;
    width: 100%;
    max-width: 620px;
    max-height: 92vh;
    overflow-y: auto;
  }
  @media(min-width:480px) { .modal { border-radius: 18px; max-height: 88vh; } }
  .modal h3 { font-size: 0.98rem; font-weight: 700; margin-bottom: 14px; }
  .modal-field { margin-bottom: 11px; }
  .modal-field label { font-size: 0.78rem; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
  .modal-field input[type="text"] {
    width: 100%;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 9px 11px; font-size: 0.86rem;
    font-family: inherit; color: #333;
  }
  .modal-field input[type="text"]:focus { outline: none; border-color: #0a3d7a; }
  .modal-meal { display: flex; gap: 7px; }
  .meal-pick {
    flex: 1; padding: 8px 0; border-radius: 9px;
    border: 1.5px solid #e2e8f0; background: #fff;
    font-size: 0.82rem; font-weight: 600; color: #888;
    cursor: pointer; transition: all 0.13s;
  }
  .meal-pick.on { background: #0a3d7a; border-color: #0a3d7a; color: #fff; }
  .review-meal { font-size: 0.66rem; padding: 1px 6px; border-radius: 10px; background: #eef2f7; color: #4a5568; font-weight: 600; }
  .modal-stars { display: flex; gap: 5px; font-size: 1.5rem; cursor: pointer; padding-top: 2px; }
  .modal-stars span { opacity: 0.22; transition: opacity 0.1s; }
  .modal-stars span.lit { opacity: 1; }
  .modal textarea {
    width: 100%; height: 80px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 9px 11px; font-size: 0.86rem; resize: none;
    font-family: inherit; color: #333; line-height: 1.5;
  }
  .modal textarea:focus { outline: none; border-color: #0a3d7a; }
  .modal-btns { display: flex; gap: 8px; margin-top: 11px; justify-content: flex-end; }
  .btn-cancel { background: #f5f5f5; color: #666; border: none; padding: 9px 16px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 0.86rem; }
  .btn-save { background: #0a3d7a; color: #fff; border: none; padding: 9px 16px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 0.86rem; }
  .saving-msg { font-size: 0.8rem; color: #888; margin-top: 8px; text-align: right; min-height: 18px; }

  .empty { text-align:center; padding:44px 20px; color:#ccc; font-size:0.86rem; }

  /* 삭제 확인 토스트 */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1a2e; color: #fff;
    padding: 10px 18px; border-radius: 12px;
    font-size: 0.83rem; font-weight: 500;
    z-index: 100; display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    white-space: nowrap;
  }
  .toast.show { display: block; animation: fadeInUp 0.2s ease; }
  @keyframes fadeInUp { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* 상단 날짜+날씨 배너 */
  .top-banner {
    background: #fff;
    border-left: 4px solid #0a3d7a;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 6px rgba(10,61,122,0.08);
  }
  .top-banner .tb-date { font-size: 0.95rem; font-weight: 800; color: #0a3d7a; margin-bottom: 5px; }
  .top-banner .tb-weather { font-size: 0.83rem; line-height: 1.5; color: #556; }
  .top-banner .tb-msg { font-size: 0.84rem; line-height: 1.55; color: #1e3a5f; margin-top: 7px; font-weight: 500; }
  .top-banner .tb-news { margin-top: 10px; padding-top: 9px; border-top: 1px dashed #e2e8f0; }
  .top-banner .tb-news-head { font-size: 0.74rem; font-weight: 700; color: #0a3d7a; margin-bottom: 5px; }
  .top-banner .tb-news-item {
    display: block; font-size: 0.78rem; color: #556; line-height: 1.5;
    text-decoration: none; padding: 2px 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

// HISTORY_DATA에 없는 직접검색/주변검색 맛집의 상세정보 캐시 (이름 → 상세)
// localStorage 영속화 → 새로고침/다른 탭에서도 상세 표시 유지
let placeDetails = {};
try { placeDetails = JSON.parse(localStorage.getItem('placeDetails') || '{}') || {}; } catch(e) { placeDetails = {}; }
function cachePlace(r) {
  if (!r || !r.name) return;
  const prev = placeDetails[r.name] || {};
  const merged = {
    name: r.name,
    cuisine: r.cuisine || prev.cuisine || '',
    price: r.price || prev.price || '',
    distance: r.distance || prev.distance || '',
    address: r.address || prev.address || '',
    feature: r.feature || prev.feature || '',
    phone: r.phone || prev.phone || '',
    verified: (r.verified !== undefined ? r.verified : prev.verified)
  };
  placeDetails[r.name] = merged;
  try { localStorage.setItem('placeDetails', JSON.stringify(placeDetails)); } catch(e) {}
}
function cachePlaces(arr) { (arr || []).forEach(cachePlace); }
// 거리 표기 정규화: "도보 1분 (카카오) / 1분 (네이버)" → "도보 1분" (가장 가까운 값)
function normDist(d) {
  if (!d) return '';
  const nums = String(d).match(/\d+/g);
  if (!nums) return String(d);
  const min = Math.min(...nums.map(Number));
  return `도보 ${min}분`;
}
// AI가 생성한 디테일한 맛집 소개 캐시 (이름 → intro 문장)
let placeIntros = {};
try { placeIntros = JSON.parse(localStorage.getItem('placeIntros') || '{}') || {}; } catch(e) { placeIntros = {}; }
let _introPending = {};   // 중복 호출 방지
// 양쪽(카카오+네이버) 거리가 이미 채워졌는지
function hasDualDist(name) {
  const d = (placeDetails[name] || {}).distance || '';
  return /카카오/.test(d) && /네이버/.test(d);
}
async function fetchPlaceIntro(name) {
  // 소개·가격·양쪽거리 모두 캐시됐으면 네트워크 호출 생략
  if (placeIntros[name] && (placeDetails[name]||{}).price && hasDualDist(name)) return placeIntros[name];
  if (_introPending[name]) return _introPending[name];
  const d = placeDetails[name] || {};
  _introPending[name] = (async () => {
    try {
      const res = await fetch(ANALYZE_URL, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ describe: name, cuisine: d.cuisine || '', address: d.address || '' })
      });
      const data = await res.json();
      // 가격·거리(카카오+네이버) 보강 (일관성)
      if (data && (data.price || data.distance)) {
        if (!placeDetails[name]) placeDetails[name] = { name };
        const pd = placeDetails[name];
        if (data.price && !pd.price) pd.price = data.price;
        // 양쪽 출처 거리가 있으면 단일 출처 거리보다 우선
        if (data.distance && /카카오|네이버/.test(data.distance)) {
          pd.distance = data.distance;
          if (data.verified !== undefined) pd.verified = data.verified;
        }
        try { localStorage.setItem('placeDetails', JSON.stringify(placeDetails)); } catch(e) {}
      }
      if (data && data.intro) {
        placeIntros[name] = data.intro;
        try { localStorage.setItem('placeIntros', JSON.stringify(placeIntros)); } catch(e) {}
        return data.intro;
      }
    } catch(e) {}
    return '';
  })();
  return _introPending[name];
}
// 어떤 소스든 가장 풍부한 소개 반환 (AI 소개 > HISTORY feature)
function bestIntro(name) {
  if (placeIntros[name]) return placeIntros[name];
  const base = (typeof findRestaurant === 'function' ? findRestaurant(name) : null) || {};
  return base.feature || '';
}
// 이름으로 장소검색 백엔드(Kakao/Naver) 재조회 → 상세 채우기 (캐시에 없을 때)
async function fetchPlaceDetail(name) {
  if (placeDetails[name] && placeDetails[name].cuisine) return placeDetails[name];
  try {
    const res = await fetch(PLACES_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: name })
    });
    const data = await res.json();
    const list = Array.isArray(data.places) ? data.places : [];
    const hit = list.find(p => p.name === name) || list.find(p => p.name && p.name.includes(name)) || list[0];
    if (hit) { cachePlace(hit); return placeDetails[name]; }
  } catch(e) {}
  return placeDetails[name] || null;
}

async function loadComments() {
  setBadge('loading', '동기화 중…');
  try {
    const r2 = await fetch(`${SB_URL}/rest/v1/comments?select=*&order=created_at.asc`, { headers: SB_HEADERS });
    if (!r2.ok) throw new Error(r2.status);
    const comments = await r2.json();
    commentsState = {};
    comments.forEach(c => {
      if (!commentsState[c.restaurant_id]) commentsState[c.restaurant_id] = [];
      commentsState[c.restaurant_id].push(c);
    });
    setBadge('ok', '☁️ 동기화됨');
    renderCondGroup();   // 현재 선택 유지하며 리뷰 반영
    renderStats();
    backfillReviewedDetails();   // HISTORY에 없는 리뷰 맛집 상세 보강
  } catch(e) {
    setBadge('err', '⚠️ 오프라인');
  }
}

// 리뷰는 있는데 상세정보가 없는 맛집(직접검색/주변검색)을 백엔드로 보강
async function backfillReviewedDetails() {
  const known = {};
  allRestaurants().forEach(r => { if (r.name) known[r.name] = 1; });
  const targets = Object.keys(commentsState).filter(n =>
    (commentsState[n] || []).length && !known[n] && !(placeDetails[n] && placeDetails[n].cuisine));
  for (const name of targets) {
    await fetchPlaceDetail(name);
    renderStats();
    await new Promise(r => setTimeout(r, 400));   // 백엔드 과부하 방지
  }
  // 소개·가격·양쪽거리가 부족한 리뷰 맛집 → 보강 (HISTORY 맛집 제외)
  const introTargets = Object.keys(commentsState).filter(n =>
    (commentsState[n] || []).length && !known[n] &&
    (!placeIntros[n] || !(placeDetails[n]||{}).price || !hasDualDist(n)));
  for (const name of introTargets) {
    await fetchPlaceIntro(name);
    renderStats();
    await new Promise(r => setTimeout(r, 1500));   // rate-limit 여유
  }
}

async function insertComment(restaurantId, reviewerName, content, rating, meal) {
  const body = {
    restaurant_id: restaurantId,
    reviewer_name: reviewerName,
    content: content || null,
    rating: rating || null,
    meal: meal || null,
    created_at: new Date().toISOString()
  };
  const res = await fetch(`${SB_URL}/rest/v1/comments`, {
    method: 'POST',
    headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  const rows = await res.json();
  return rows[0];
}

async function deleteComment(commentId) {
  const res = await fetch(`${SB_URL}/rest/v1/comments?id=eq.${commentId}`, {
    method: 'DELETE',
    headers: SB_HEADERS
  });
  if (!res.ok) throw new Error(await res.text());
}

async function updateComment(commentId, reviewerName, content, rating, meal) {
  const res = await fetch(`${SB_URL}/rest/v1/comments?id=eq.${commentId}`, {
    method: 'PATCH',
    headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
    body: JSON.stringify({
      reviewer_name: reviewerName,
      content: content || null,
      rating: rating || null,
      meal: meal || null
    })
  });
  if (!res.ok) throw new Error(await res.text());
  const rows = await res.json();
  return rows[0];
}

// ── 이모지 ────────────────────────────────────────────────────
function emo(c) {
  if (!c) return '🍽️';
  if (c.includes('일식')) return '🍜';
  if (c.includes('한식')) return '🍲';
  if (c.includes('중식')) return '🥢';
  if (c.includes('버거')) return '🍔';
  return '🍽️';
}

function avatarColor(name) {
  const colors = ['#0a3d7a','#3182ce','#38a169','#805ad5','#d69e2e','#e53e3e','#319795'];
  let h = 0;
  for (let i=0; i<name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
  return colors[Math.abs(h) % colors.length];
}

function starsHtml(rating) {
  if (!rating) return '';
  return '⭐'.repeat(rating) + '<span style="opacity:0.3">☆</span>'.repeat(5 - rating);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ── 카드 그룹 렌더 (공통) ────────────────────────────────────
// bare=true: 날짜/날씨 헤더 없이 카드만 (홈 today-group용, 상단 배너와 중복 방지)
// 추천 태그 → 배지 라벨
const TAG_BADGE = {
  '근처유명': '⭐ 10분내 유명',
  '검색유명': '🔍 검색 인기',
};

function buildCard(r) {
  const cms = commentsState[r.name] || [];
  const reviewsHtml = cms.length
    ? cms.map(c => {
        const initial = (c.reviewer_name||'?').charAt(0).toUpperCase();
        const color = avatarColor(c.reviewer_name||'?');
        return `<div class="review-item">
          <div class="review-avatar" style="background:${color}">${initial}</div>
          <div class="review-right">
            <div class="review-header">
              <span class="review-name">${escHtml(c.reviewer_name)}</span>
              ${c.meal ? `<span class="review-meal">${escHtml(c.meal)}</span>` : ''}
              ${c.rating ? `<span class="review-stars">${starsHtml(c.rating)}</span>` : ''}
              <span class="review-date">${fmtDate(c.created_at)}</span>
            </div>
            ${c.content ? `<div class="review-content">${escHtml(c.content)}</div>` : ''}
          </div>
          <div class="review-actions">
            <button class="btn-edit-review" title="수정" onclick="editReview('${c.id}','${escAttr(r.name)}')">✏️</button>
            <button class="btn-del-review" title="삭제" onclick="confirmDelete('${c.id}','${escAttr(r.name)}')">✕</button>
          </div>
        </div>`;
      }).join('')
    : '<div class="no-reviews">아직 리뷰가 없습니다.</div>';
  const cnt = cms.length;
  const ratings = cms.map(c => c.rating).filter(Boolean);
  const avgStar = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : null;
  const reviewBadge = cnt ? `<span class="badge badge-review">⭐ ${avgStar || '-'} · 리뷰 ${cnt}</span>` : '';
  const tagBadge = r.tag && TAG_BADGE[r.tag] ? `<span class="badge badge-tag">${TAG_BADGE[r.tag]}</span>` : '';
  return `<div class="card ${cnt?'has-review':''}${r.tag?' card-extra':''}" id="c-${escAttr(r.name)}">
    <div class="card-stripe"></div>
    <div class="card-emoji">${emo(r.cuisine)}</div>
    <div class="card-body">
      <div class="card-top">
        <span class="card-name">${r.name}</span>
        <span class="badge badge-cuisine">${r.cuisine}</span>
        ${tagBadge}
        ${reviewBadge}
      </div>
      <div class="card-feature">${r.feature}</div>
      <div class="card-meta">
        <span>💰 ${r.price}</span>
        <span>🚶 ${r.distance}</span>
      </div>
      <div class="reviews-block">${reviewsHtml}</div>
    </div>
    <div class="card-actions">
      ${r.verified === false
        ? `<span class="btn-map nomap" title="지도에서 확인되지 않은 가게입니다">🚫 지도없음</span>`
        : `<a class="btn-map" href="https://map.naver.com/p/search/${encodeURIComponent(r.name + ' 여의도')}" target="_blank" rel="noopener">📍 지도</a>`}
      <button class="btn-review" onclick="openModal('${escAttr(r.name)}','${escAttr(r.feature)}')">📝 ${cnt?'리뷰 '+cnt:'리뷰'}</button>
      <button class="btn-reserve" onclick="openReserve('${escAttr(r.name)}')">📞 예약</button>
    </div>
  </div>`;
}

function renderGroup(group, bare) {
  const d = new Date(group.date);
  const days = ['일','월','화','수','목','금','토'];
  const label = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  const cards = group.restaurants.map(buildCard).join('');
  // 추가 추천 (10분내 유명 / 검색 유명) — 하단 별도 섹션
  const extras = (group.extras || []).filter(Boolean);
  const extrasHtml = extras.length
    ? `<div class="extra-head">✨ 이런 곳도 가볼 만해요</div><div class="cards">${extras.map(buildCard).join('')}</div>`
    : '';
  if (bare) {
    return `<div class="cards">${cards}</div>${extrasHtml}`;
  }
  const commentHtml = group.comment
    ? `<div class="weather-comment">🌤️ ${escHtml(group.comment)}</div>`
    : '';
  return `<div class="date-group">
    <div class="date-label">📅 ${label}</div>
    ${commentHtml}
    <div class="cards">${cards}</div>
    ${extrasHtml}
  </div>`;
}

// 시간대 기반 기본 선택: ~15시 점심, 15~18시 저녁, 18시~ 술집
function getDefaultMeal() {
  const h = new Date().getHours();
  if (h < 15) return '점심';
  if (h < 18) return '저녁';
  return '술집';
}

function matchCondition(text) {
  const t = text.replace(/\s/g, '');
  let best = '', bestScore = 0;
  for (const [cond, kws] of Object.entries(COND_KEYWORDS)) {
    let score = 0;
    for (const kw of kws) if (t.includes(kw)) score++;
    if (score > bestScore) { bestScore = score; best = cond; }
  }
  return bestScore > 0 ? best : '';
}

// 백엔드(Edge Function) 호출로 맞춤 맛집 생성 후 화면 업데이트
async function generateRecommend(text, meal, saveHist) {
  track('custom_recommend', `${meal} / ${text}`);
  const answerEl = document.getElementById('pref-answer');
  const progEl = document.getElementById('pref-progress');
  const fill = document.getElementById('pref-progress-fill');
  const progText = document.getElementById('pref-progress-text');
  const btn = document.getElementById('pref-btn');

  answerEl.classList.remove('show');
  if (btn) btn.disabled = true;
  progEl.classList.add('show');
  fill.style.width = '0%';

  const steps = [
    { t: `${MEAL_EMOJI[meal]} ${meal} 자리 분석 중…`, w: 30 },
    { t: 'AI가 취향 파악 중…', w: 60 },
    { t: '맞춤 맛집 선별 중…', w: 85 },
  ];
  let i = 0;
  let progTimer = setInterval(() => {
    if (i < steps.length) { progText.textContent = steps[i].t; fill.style.width = steps[i].w + '%'; i++; }
  }, 400);

  let comment = '', restaurants = null, extras = [], ok = false, errMsg = '';
  try {
    const res = await fetch(ANALYZE_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, meal })
    });
    const data = await res.json();
    comment = data.comment || '';
    restaurants = Array.isArray(data.restaurants) ? data.restaurants : null;
    extras = Array.isArray(data.extras) ? data.extras : [];
    if (data.error) errMsg = data.message || (data.error === 'rate_limited' ? 'AI 요청이 잠시 몰렸어요. 30초 후 다시 시도해주세요.' : '');
    ok = !!(restaurants && restaurants.length);
  } catch (e) { ok = false; }

  clearInterval(progTimer);
  fill.style.width = '100%';
  progText.textContent = '완료!';

  setTimeout(() => {
    progEl.classList.remove('show');
    if (btn) btn.disabled = false;

    if (ok) {
      const label = text ? `🔎 "${text}" 맞춤 추천` : `${MEAL_EMOJI[meal]} 오늘의 ${meal} 추천`;
      customResult = { label, comment, restaurants, extras };
      cachePlaces([...(restaurants||[]), ...(extras||[])]);
      answerEl.innerHTML = `<div class="pa-head">${escHtml(label)}</div>${escHtml(comment)}`;
      answerEl.classList.add('show');
      renderCustomGroup();
      if (saveHist && text) addHistory(text);
    } else if (errMsg) {
      answerEl.innerHTML = `<div class="pa-head">⏳ 잠시만요</div>${escHtml(errMsg)}`;
      answerEl.classList.add('show');
    } else {
      answerEl.innerHTML = `<div class="pa-head">⚠️ 추천 생성 실패</div>네트워크 문제로 맞춤 추천을 못 가져왔어요. 잠시 후 다시 시도해주세요.`;
      answerEl.classList.add('show');
    }
  }, 300);
}

  if (meal === '점심') return { restaurants: day.restaurants, by_condition: day.by_condition, extras: day.extras };
  return (day.meals && day.meals[meal]) || null;
}

  const md = getMealData(getDay(), currentMeal);

function renderCondGroup() {
  if (customResult) { renderCustomGroup(); return; }
  const day = getDay();
  const md = getMealData(day, currentMeal);
  if (!md || !md.restaurants || !md.restaurants.length) {
    document.getElementById('today-group').innerHTML =
      `<div class="empty">아직 ${currentMeal} 추천 데이터가 없어요.<br>아래 직접 입력으로 추천받아보세요!</div>`;
    return;
  }
  const isBase = !(currentCond && md.by_condition && md.by_condition[currentCond]);
  const restaurants = isBase ? md.restaurants : md.by_condition[currentCond];
  // 추가 추천(extras)은 기본(컨디션 미선택) 보기에서만 노출
  const extras = isBase ? md.extras : null;
  document.getElementById('today-group').innerHTML = renderGroup({ date: day.date, restaurants, extras }, true);
}

function findRestaurant(name) {
  if (customResult) {
    const all = [...(customResult.restaurants||[]), ...(customResult.extras||[])];
    const hit = all.find(r => r.name === name);
    if (hit) return hit;
  }
  const inSearch = (searchedPlaces || []).find(r => r.name === name);
  if (inSearch) return inSearch;
  const inHist = allRestaurants().find(r => r.name === name);
  if (inHist) return inHist;
  return placeDetails[name] || null;
}

// 모달 상단 상세정보(칩 + 주소 + 지도) 렌더 — info 없으면 이름만으로 지도 제공
function renderModalDetail(name, info) {
  const detailEl = document.getElementById('modal-detail');
  if (!detailEl) return;
  info = info || {};
  const chips = [];
  if (info.cuisine) chips.push(`<span class="md-chip">${emo(info.cuisine)} ${escHtml(info.cuisine)}</span>`);
  if (info.price) chips.push(`<span class="md-chip">💰 ${escHtml(info.price)}</span>`);
  if (info.distance) chips.push(`<span class="md-chip">🚶 ${escHtml(info.distance)}</span>`);
  if (info.address) chips.push(`<span class="md-chip">📍 ${escHtml(info.address)}</span>`);
  const mapQ = name.includes('여의도') ? name : name + ' 여의도';
  const mapBtn = info.verified === false
    ? `<span class="md-map nomap" title="지도 미등록">🚫 지도없음</span>`
    : `<a class="md-map" href="https://map.naver.com/p/search/${encodeURIComponent(mapQ)}" target="_blank" rel="noopener">📍 지도</a>`;
  detailEl.innerHTML = chips.join('') + mapBtn;
  detailEl.style.display = 'flex';
}
function openModal(name, feature, editC) {
  mId = name; mRating = editC ? (editC.rating || 0) : 0; mFeature = feature || '';
  mEditId = editC ? editC.id : null;
  // 끼니 기본값: 수정이면 기존 값, 아니면 현재 보고 있는 시간대
  mMeal = editC && editC.meal ? editC.meal
        : ((typeof currentMeal !== 'undefined' && currentMeal) ? currentMeal : '점심');
  document.querySelectorAll('#modal-meal .meal-pick').forEach(b =>
    b.classList.toggle('on', b.dataset.meal === mMeal));
  document.getElementById('modal-title').textContent = editC ? `✏️ 리뷰 수정 — ${name}` : `🍽️ ${name}`;
  // 맛집 상세정보 (종류/가격/거리/주소 + 지도) — 캐시/HISTORY/검색결과 통합
  const info = findRestaurant(name);
  renderModalDetail(name, info);
  // 디테일한 AI 소개가 있으면 우선 사용
  if (placeIntros[name]) feature = placeIntros[name];
  else if (info && !feature && info.feature) feature = info.feature;
  mFeature = feature || mFeature;
  // 맛집 소개
  const introEl = document.getElementById('modal-intro');
  function setIntro(txt) {
    introEl.innerHTML = txt ? `💬 ${escHtml(txt)}` : '';
    introEl.style.display = txt ? 'block' : 'none';
  }
  setIntro(feature);
  // 상세정보가 비어있으면(직접검색/주변검색 맛집) 백엔드로 재조회해 채움
  if (!info || !info.cuisine) {
    fetchPlaceDetail(name).then(d => {
      if (d && mId === name) renderModalDetail(name, d);
    });
  }
  // 디테일한 AI 소개가 아직 없으면 생성해서 채움
  if (!placeIntros[name]) {
    fetchPlaceIntro(name).then(intro => {
      if (intro && mId === name) { mFeature = intro; setIntro(intro); }
    });
  }
  // 기존 리뷰 목록
  const cms = commentsState[name] || [];
  const revEl = document.getElementById('modal-reviews');
  if (cms.length) {
    const rated = cms.map(c => c.rating).filter(Boolean);
    const avg = rated.length ? (rated.reduce((a,b)=>a+b,0)/rated.length) : 0;
    const avgBadge = rated.length
      ? `<span class="mr-avg">${'⭐'.repeat(Math.round(avg))} ${avg.toFixed(1)}</span>` : '';
    revEl.innerHTML = `<div class="mr-head">📝 리뷰 <span style="color:#3182ce">${cms.length}</span>개${avgBadge}</div>` + cms.map(c => {
      const initial = (c.reviewer_name||'?').charAt(0).toUpperCase();
      const color = avatarColor(c.reviewer_name||'?');
      return `<div class="review-item">
        <div class="review-avatar" style="background:${color}">${initial}</div>
        <div class="review-right">
          <div class="review-header">
            <span class="review-name">${escHtml(c.reviewer_name)}</span>
            ${c.meal ? `<span class="review-meal">${escHtml(c.meal)}</span>` : ''}
            ${c.rating ? `<span class="review-stars">${starsHtml(c.rating)}</span>` : ''}
            <span class="review-date">${fmtDate(c.created_at)}</span>
          </div>
          ${c.content ? `<div class="review-content">${escHtml(c.content)}</div>` : ''}
        </div>
        <div class="review-actions">
          <button class="btn-edit-review" title="수정" onclick="editReview('${c.id}','${escAttr(name)}')">✏️</button>
          <button class="btn-del-review" title="삭제" onclick="confirmDelete('${c.id}','${escAttr(name)}')">✕</button>
        </div>
      </div>`;
    }).join('');
    revEl.style.display = 'flex';
  } else {
    revEl.innerHTML = '<div class="mr-head" style="border:none;padding-bottom:0">📝 아직 리뷰가 없어요 — 첫 리뷰를 남겨보세요!</div>';
    revEl.style.display = 'flex';
  }
  // 작성/수정 섹션 헤더 전환
  const writeHead = document.getElementById('modal-write-head');
  if (writeHead) writeHead.textContent = editC ? '✏️ 리뷰 수정' : '✍️ 리뷰 작성';
  // 수정 모드면 기존 값 채우기
  document.getElementById('modal-name').value = editC ? (editC.reviewer_name || '') : '';
  document.getElementById('modal-text').value = editC ? (editC.content || '') : '';
  document.getElementById('saving-msg').textContent = '';
  document.getElementById('btn-save').disabled = false;
  document.getElementById('btn-save').textContent = editC ? '수정 저장' : '저장';
  renderModalStars();
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 100);
}

  document.getElementById('reserve-title').textContent = `📞 ${name} 예약`;
  document.getElementById('reserve-sub').textContent = '원하는 방법으로 예약하세요.';
  const naverUrl = `https://map.naver.com/p/search/${encodeURIComponent(name + ' 여의도')}`;
  const cached = placeDetails[name] || {};
  const phoneRow = (phone) => phone
    ? `<a class="reserve-opt" href="tel:${fmtPhone(phone)}">
         <span class="ro-emoji">📞</span>
         <span class="ro-text">전화 예약<div class="ro-desc">${escHtml(phone)}</div></span>
         <span class="ro-arrow">›</span></a>`
    : `<div class="reserve-opt disabled" id="reserve-phone-row">
         <span class="ro-emoji">📞</span>
         <span class="ro-text">전화 예약<div class="ro-desc">전화번호 확인 중…</div></span></div>`;
  document.getElementById('reserve-opts').innerHTML = `
    <a class="reserve-opt naver" href="${naverUrl}" target="_blank" rel="noopener">
      <span class="ro-emoji">🟢</span>
      <span class="ro-text">네이버 예약 · 지도<div class="ro-desc">네이버 지도에서 예약·전화·길찾기</div></span>
      <span class="ro-arrow">›</span></a>
    ${phoneRow(cached.phone)}`;
  document.getElementById('reserve-bg').classList.add('open');
  // 전화번호가 캐시에 없으면 백엔드로 조회해서 채움
  if (!cached.phone) {
    fetchPlacePhone(name).then(phone => {
      if (reserveName !== name) return;
      const row = document.getElementById('reserve-phone-row');
      if (!row) return;
      if (phone) {
        row.outerHTML = `<a class="reserve-opt" href="tel:${fmtPhone(phone)}">
           <span class="ro-emoji">📞</span>
           <span class="ro-text">전화 예약<div class="ro-desc">${escHtml(phone)}</div></span>
           <span class="ro-arrow">›</span></a>`;
      } else {
        row.querySelector('.ro-desc').textContent = '등록된 전화번호가 없어요 (네이버에서 확인)';
      }
    });
  }
}
async function fetchPlacePhone(name) {
  if (placeDetails[name] && placeDetails[name].phone) return placeDetails[name].phone;
  try {
    const res = await fetch(PLACES_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: name })
    });
    const data = await res.json();
    const list = Array.isArray(data.places) ? data.places : [];
    const hit = list.find(p => p.name === name) || list.find(p => p.name && p.name.includes(name)) || list[0];
    if (hit) { cachePlace(hit); return hit.phone || ''; }
  } catch(e) {}
  return '';
}

function renderModalStars() {
  document.querySelectorAll('#modal-stars span').forEach(s => {
    s.classList.toggle('lit', parseInt(s.dataset.v) <= mRating);
  });
}
document.querySelectorAll('#modal-stars span').forEach(s => {
  s.addEventListener('click', () => { mRating = parseInt(s.dataset.v); renderModalStars(); });
});
document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.getElementById('reserve-bg').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeReserve();
});

async function saveReview() {
  if (!mId) return;
  const name = document.getElementById('modal-name').value.trim();
  const text = document.getElementById('modal-text').value.trim();
  if (!name) {
    document.getElementById('saving-msg').textContent = '⚠️ 이름을 입력해주세요.';
    document.getElementById('modal-name').focus();
    return;
  }
  if (!text && !mRating) {
    document.getElementById('saving-msg').textContent = '⚠️ 별점 또는 리뷰 내용을 입력해주세요.';
    return;
  }

  const btn = document.getElementById('btn-save');
  const msg = document.getElementById('saving-msg');
  btn.disabled = true;
  msg.textContent = mEditId ? '수정 중…' : '저장 중…';

  try {
    if (mEditId) {
      const updated = await updateComment(mEditId, name, text, mRating, mMeal);
      const arr = commentsState[mId] || [];
      const i = arr.findIndex(c => String(c.id) === String(mEditId));
      if (i >= 0) arr[i] = updated;
      setBadge('ok', '☁️ 동기화됨');
      track('review_edit', `${mId} / ${name}`);
      closeModal();
      renderHistory(); renderStats();
      showToast('✏️ 리뷰가 수정되었습니다!');
    } else {
      const newComment = await insertComment(mId, name, text, mRating, mMeal);
      if (!commentsState[mId]) commentsState[mId] = [];
      commentsState[mId].push(newComment);
      setBadge('ok', '☁️ 동기화됨');
      track('review_create', `${mId} / ${name} / ★${mRating} / ${mMeal}`);
      closeModal();
      renderHistory(); renderStats();
      showToast('✅ 리뷰가 저장되었습니다!');
    }
  } catch(e) {
    msg.textContent = '⚠️ 저장 실패. 다시 시도해주세요.';
    btn.disabled = false;
    setBadge('err', '⚠️ 저장 실패');
  }
}

// ── 리뷰 삭제 ─────────────────────────────────────────────────
async function confirmDelete(commentId, restaurantId) {
  if (!confirm('이 리뷰를 삭제하시겠습니까?')) return;
  setBadge('loading', '삭제 중…');
  track('review_delete', `${restaurantId}`);
  try {
    await deleteComment(commentId);
    if (commentsState[restaurantId]) {
      commentsState[restaurantId] = commentsState[restaurantId].filter(c => c.id !== commentId);
    }
    renderHistory(); renderStats();
    setBadge('ok', '☁️ 동기화됨');
    showToast('🗑️ 리뷰가 삭제되었습니다.');
    if (mId === restaurantId) openModal(mId, mFeature);
  } catch {
    setBadge('err', '⚠️ 삭제 실패');
    showToast('⚠️ 삭제에 실패했습니다. 다시 시도해주세요.');
  }
}

// ── 통계 ──────────────────────────────────────────────────────
// 모든 시간대·컨디션의 맛집을 평탄화 (점심/저녁/술집 + by_condition)
function allRestaurants() {
  const out = [];
  HISTORY_DATA.forEach(day => {
    const buckets = [];
    if (day.restaurants) buckets.push(day.restaurants);
    if (day.by_condition) buckets.push(...Object.values(day.by_condition));
    if (day.meals) Object.values(day.meals).forEach(m => {
      if (m && m.restaurants) buckets.push(m.restaurants);
      if (m && m.by_condition) buckets.push(...Object.values(m.by_condition));
    });
    buckets.forEach(b => b.forEach(r => out.push(r)));
  });
  return out;
}

function renderStats() {
  const allR = allRestaurants();
  const byName = {};
  allR.forEach(r => { if (r.name && !byName[r.name]) byName[r.name] = r; });
  const uniqueNames = new Set(allR.map(r => r.name)).size;

  const allComments = Object.values(commentsState).flat();
  const ratings = allComments.map(c => c.rating).filter(Boolean);
  const avg = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '-';

  // 리뷰가 있는 모든 맛집 (HISTORY_DATA에 없어도 — 직접검색·주변검색 포함)
  const topList = Object.keys(commentsState)
    .filter(name => (commentsState[name] || []).length)
    .map(name => {
      const cms = commentsState[name];
      const rs = cms.map(c => c.rating).filter(Boolean);
      const av = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 0;
      const base = byName[name] || placeDetails[name] || {};
      return {
        name,
        cuisine: base.cuisine || '',
        feature: placeIntros[name] || base.feature || '',
        price: base.price || '',
        distance: base.distance || '',
        address: base.address || '',
        verified: base.verified,
        avg: av,
        cnt: cms.length,
        rated: rs.length > 0
      };
    })
    .sort((a, b) => (b.avg - a.avg) || (b.cnt - a.cnt));

  // 내 주변 맛집 카드 — 버튼 클릭(목록 로드) 후에만 검색창 노출
  const placeOpened = nearbyLoaded || !!placeSearchQ;
  const searchRow = placeOpened ? `
      <div class="place-search-row">
        <input class="place-input" id="place-q" value="${escHtml(placeSearchQ)}"
               placeholder="이름으로 찾기 (예: 스타벅스, 소몽)" maxlength="30"
               onkeydown="if(event.key==='Enter')searchPlaces()">
        <button class="place-btn" id="place-btn" onclick="searchPlaces()">검색</button>
      </div>` : '';
  const searchHtml = `
    <div class="place-search-card">
      <div class="place-head-row">
        <div class="pref-title" style="margin:0">📍 내 주변 맛집에 리뷰 남기기</div>
        ${nearbyLoaded ? '<button class="place-refresh" onclick="loadNearby(true)" title="새로고침">🔄</button>' : ''}
      </div>
      ${searchRow}
      <div id="place-results">${renderPlaceResults()}</div>
    </div>`;

  document.getElementById('tab-stats').innerHTML = `
    <div class="stats-grid" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat-card"><div class="stat-num">${allComments.length}</div><div class="stat-label">총 리뷰 수</div></div>
      <div class="stat-card"><div class="stat-num">${avg}</div><div class="stat-label">평균 별점</div></div>
    </div>
    ${searchHtml}
    <div class="top-list">
      <h3>⭐ 리뷰 맛집 (평균 별점순) · 눌러서 리뷰 보기</h3>
      ${topList.length ? topList.map((r,i) => `<div class="top-item" onclick="openModal('${escAttr(r.name)}','${escAttr(r.feature||'')}')">
        <div class="top-rank">${i+1}</div>
        <div class="top-info">
          <div class="top-name">${emo(r.cuisine)} ${r.name} <span class="top-stars-inline">${r.rated ? `${'⭐'.repeat(Math.round(r.avg))} <small>${r.avg.toFixed(1)}</small> · ` : ''}리뷰 ${r.cnt}</span></div>
          <div class="top-cuisine">${r.cuisine||''}</div>
          ${r.feature ? `<div class="top-feature">${escHtml(r.feature)}</div>` : ''}
          <div class="top-meta">
            ${r.price ? `<span>💰 ${escHtml(r.price)}</span>` : ''}
            ${r.distance ? `<span>🚶 ${escHtml(r.distance)}</span>` : ''}
            ${r.verified === false ? `<span style="color:#c05">🚫 지도없음</span>` : ''}
          </div>
        </div>
      </div>`).join('') : '<div style="color:#ccc;font-size:0.82rem;padding:10px 0">아직 평가한 맛집이 없습니다.</div>'}
    </div>`;
}

// ── 내 주변 맛집 ──────────────────────────────────────────────
let searchedPlaces = [];   // [{name, cuisine, distance, address, verified}]
let placeSearchQ = '';     // 이름 검색어 (없으면 주변 목록 모드)
let placeSearchBusy = false;
let placeOrigin = '';      // '현위치' | 'JB빌딩'
let myPos = null;          // {lat, lng} (한 번 받으면 캐시)
let nearbyLoaded = false;  // 리뷰 탭 첫 진입 시 1회 자동 로드

// 브라우저 GPS 위치 (권한 거부/실패 시 null → JB빌딩 폴백)
function getMyPosition() {
  return new Promise(resolve => {
    if (myPos) { resolve(myPos); return; }
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p => { myPos = { lat: p.coords.latitude, lng: p.coords.longitude }; resolve(myPos); },
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 7000, maximumAge: 300000 }
    );
  });
}

function renderPlaceResults() {
  if (placeSearchBusy) return '<div class="place-hint">📍 주변 맛집 불러오는 중…</div>';
  // 아직 안 불러왔고 검색도 안 했으면 → 버튼 노출
  if (!nearbyLoaded && !placeSearchQ) {
    return `<button class="place-nearby-btn" onclick="loadNearby(true)">📍 내 주변 맛집 보기</button>
      <div class="place-hint" style="text-align:center">버튼을 누르면 내 위치 주변 맛집을 보여드려요. (위치 허용 권장)</div>`;
  }
  if (!searchedPlaces.length) {
    return placeSearchQ
      ? '<div class="place-hint">검색 결과가 없어요. 다른 이름으로 시도해보세요.</div>'
      : '<div class="place-hint">주변 맛집을 불러오지 못했어요. 🔄 새로고침 또는 이름으로 검색해보세요.</div>';
  }
  const base = placeOrigin === '현위치' ? '현재 내 위치' : 'JB빌딩';
  const originNote = placeSearchQ
    ? `<div class="place-origin">🔎 "${escHtml(placeSearchQ)}" 검색 · ${base} 기준 · 카카오+네이버</div>`
    : `<div class="place-origin">📍 ${base} 주변 맛집 · 가까운 순 · 카카오+네이버</div>`;
  const SRC_CLS = { '카카오': 'src-kakao', '네이버': 'src-naver' };
  return originNote + searchedPlaces.map(p => {
    const cms = commentsState[p.name] || [];
    const cnt = cms.length;
    const srcBadge = p.source ? `<span class="src-badge ${SRC_CLS[p.source]||''}">${escHtml(p.source)}</span>` : '';
    return `<div class="place-item">
      <div class="place-info" onclick="openModal('${escAttr(p.name)}','')">
        <div class="place-name">${emo(p.cuisine)} ${escHtml(p.name)} ${srcBadge} ${cnt?`<span class="badge badge-review">리뷰 ${cnt}</span>`:''}</div>
        <div class="place-sub">${escHtml(p.cuisine||'')} · 🚶 ${escHtml(p.distance||'')}</div>
        ${p.address?`<div class="place-addr">📍 ${escHtml(p.address)}</div>`:''}
      </div>
      <button class="place-review-btn" onclick="openModal('${escAttr(p.name)}','')">📝 리뷰</button>
    </div>`;
  }).join('');
}

// 공통 조회: query 없으면 주변 목록, 있으면 이름 검색
async function fetchPlaces(query) {
  track(query ? 'place_search' : 'nearby', query || '');
  placeSearchBusy = true;
  nearbyLoaded = true;
  const rwrap = document.getElementById('place-results');
  if (rwrap) rwrap.innerHTML = renderPlaceResults();
  const pos = await getMyPosition();   // 허용 시 내 위치, 거부 시 JB 폴백
  try {
    const reqBody = {};
    if (query) reqBody.query = query;
    if (pos) { reqBody.lat = pos.lat; reqBody.lng = pos.lng; }
    const res = await fetch(PLACES_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(reqBody)
    });
    const data = await res.json();
    searchedPlaces = Array.isArray(data.places) ? data.places : [];
    cachePlaces(searchedPlaces);
    placeOrigin = data.origin || (pos ? '현위치' : 'JB빌딩');
  } catch (e) {
    searchedPlaces = [];
  }
  placeSearchBusy = false;
  renderStats();
}

// 내 주변 맛집 자동 목록 (검색어 없이)
async function loadNearby(force) {
  if (nearbyLoaded && !force) return;
  placeSearchQ = '';
  await fetchPlaces('');
}

// 이름으로 특정 가게 검색
async function searchPlaces() {
  const inp = document.getElementById('place-q');
  if (!inp) return;
  const q = inp.value.trim();
  placeSearchQ = q;
  if (!q) { await loadNearby(true); return; }   // 비우고 검색 = 주변 목록
  await fetchPlaces(q);
}

// ── 탭 전환 ───────────────────────────────────────────────────
function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ── 초기화 ────────────────────────────────────────────────────
init();
</script>
