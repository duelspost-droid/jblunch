<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ JB×AX 맛집 트래커</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #f5f6fa;
    color: #1a1a2e;
    min-height: 100vh;
  }
  .app-header {
    background: linear-gradient(100deg, #0a3d7a 0%, #1565c0 100%);
    padding: 15px 18px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 10px rgba(10,61,122,0.18);
    cursor: pointer;
  }
  .app-header:active { opacity: 0.92; }
  .app-header .logo {
    font-size: 1.35rem; line-height: 1;
    background: #fff;
    width: 40px; height: 40px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  .app-header .title-block { min-width: 0; }
  .app-header .title-block h1 { font-size: 1.08rem; font-weight: 800; color: #fff; letter-spacing: -0.2px; white-space: nowrap; }
  .app-header .title-block h1 .hl-ax {
    background: linear-gradient(90deg, #ffd54a, #ffb300);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900; letter-spacing: 0;
  }
  .app-header .title-block p { font-size: 0.74rem; color: rgba(255,255,255,0.8); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 위치 선택 (커스텀 드롭다운) */
  .loc-wrap { margin-left: auto; flex-shrink: 0; position: relative; }
  .loc-btn {
    display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.28);
    border-radius: 999px; padding: 6px 11px; color: #fff;
    font-size: 0.78rem; font-weight: 700; font-family: inherit;
    transition: background .12s, border-color .12s;
  }
  .loc-btn:hover { background: rgba(255,255,255,0.25); }
  .loc-btn .loc-pin { font-size: 0.74rem; line-height: 1; }
  .loc-btn .loc-caret { font-size: 0.62rem; opacity: 0.85; transition: transform .18s; }
  .loc-wrap.open .loc-btn { background: rgba(255,255,255,0.28); border-color: rgba(255,255,255,0.55); }
  .loc-wrap.open .loc-caret { transform: rotate(180deg); }
  .loc-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 30;
    background: #fff; border-radius: 13px; padding: 6px;
    box-shadow: 0 8px 26px rgba(10,40,90,0.22); border: 1px solid #eaeef4;
    min-width: 168px; opacity: 0; visibility: hidden; transform: translateY(-6px);
    transition: opacity .15s, transform .15s, visibility .15s;
  }
  .loc-wrap.open .loc-menu { opacity: 1; visibility: visible; transform: translateY(0); }
  .loc-opt {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    width: 100%; text-align: left; cursor: pointer;
    background: none; border: none; border-radius: 9px; padding: 9px 11px; font-family: inherit;
  }
  .loc-opt:hover { background: #f3f7fc; }
  .loc-opt .lo-name { font-size: 0.84rem; font-weight: 700; color: #1a2a44; }
  .loc-opt .lo-sub { font-size: 0.7rem; color: #8794a6; }
  .loc-opt.on { background: #eaf2fd; }
  .loc-opt.on .lo-name { color: #0a3d7a; }
  .loc-opt.on .lo-name::after { content: ' ✓'; color: #1565c0; font-weight: 900; }
  .sync-badge {
    margin-left: auto;
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }
  .sync-badge.ok { background: #c6f6d5; color: #22543d; }
  .sync-badge.loading { background: #ebf8ff; color: #2b6cb0; }
  .sync-badge.err { background: #fff5f5; color: #c53030; }

  .tabs {
    display: flex;
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 0 16px;
  }
  .tab {
    padding: 11px 16px;
    border: none;
    background: none;
    font-size: 0.86rem;
    font-weight: 500;
    color: #aaa;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }
  .tab.active { color: #0a3d7a; border-bottom-color: #0a3d7a; }
  .suggest-tab-btn {
    margin-left: auto; align-self: center;
    background: none; border: 1.5px solid #0a3d7a; border-radius: 20px;
    color: #0a3d7a; font-size: 0.75rem; font-weight: 700; font-family: inherit;
    padding: 4px 11px; cursor: pointer; white-space: nowrap;
    transition: background .12s, color .12s;
  }
  .suggest-tab-btn:hover { background: #0a3d7a; color: #fff; }
  /* 기능제안 모달 */
  .sug-modal-bg {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(10,30,60,0.45); align-items: flex-end; justify-content: center;
  }
  .sug-modal-bg.open { display: flex; }
  .sug-modal {
    background: #fff; width: 100%; max-width: 520px;
    border-radius: 20px 20px 0 0; padding: 22px 20px 32px;
    box-shadow: 0 -6px 30px rgba(10,40,90,0.18);
    animation: slideUp .22s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity:0; } to { transform: translateY(0); opacity:1; } }
  .sug-modal h3 { font-size: 1rem; font-weight: 800; color: #0a3d7a; margin-bottom: 4px; }
  .sug-modal .sug-desc { font-size: 0.78rem; color: #8794a6; margin-bottom: 14px; }
  .sug-modal textarea {
    width: 100%; height: 110px; border: 1.5px solid #e2e8f0; border-radius: 12px;
    padding: 10px 12px; font-size: 0.88rem; resize: none; font-family: inherit;
    color: #333; line-height: 1.55; margin-bottom: 9px;
  }
  .sug-modal textarea:focus { outline: none; border-color: #0a3d7a; }
  .sug-modal input[type=text] {
    width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 9px 12px; font-size: 0.86rem; font-family: inherit; color: #333; margin-bottom: 12px;
  }
  .sug-modal input[type=text]:focus { outline: none; border-color: #0a3d7a; }
  .sug-modal .sug-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .sug-modal .sug-msg { font-size: 0.78rem; min-height: 18px; margin-bottom: 8px; }
  .sug-modal .sug-msg.err { color: #c53030; }
  .sug-modal .sug-msg.ok { color: #2f855a; }
  /* 답변된 제안 Q&A */
  .sug-qna { margin-top: 18px; border-top: 1px solid #eef1f6; padding-top: 14px; }
  .sug-qna-title { font-size: 0.84rem; font-weight: 800; color: #0a3d7a; margin-bottom: 10px; }
  .sug-qna-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
  .sug-qna-empty { font-size: 0.78rem; color: #8794a6; padding: 4px 2px; }
  .qna-item { background: #f7f9fc; border: 1px solid #eef1f6; border-radius: 12px; padding: 11px 13px; }
  .qna-q { font-size: 0.83rem; color: #1a2a44; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .qna-q::before { content: 'Q '; font-weight: 900; color: #1565c0; }
  .qna-a { margin-top: 8px; padding: 8px 10px; background: #eef6f0; border-radius: 9px; font-size: 0.82rem; color: #2f6a46; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .qna-a::before { content: 'A '; font-weight: 900; color: #2f855a; }
  .qna-date { font-size: 0.68rem; color: #a0acbd; margin-top: 6px; }
  .qna-date-q { margin-top: 4px; color: #8aa0bd; }
  .qna-pending { margin-top: 8px; padding: 7px 10px; background: #fff7ed; border: 1px dashed #f0c98a; border-radius: 9px; font-size: 0.78rem; color: #b5762a; }

  .content { padding: 14px; max-width: 640px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }

  /* PC 반응형: 넓은 화면에서 폭 확대 + 카드 2단 */
  @media (min-width: 900px) {
    .content { max-width: 1000px; padding: 18px 24px; }
    .section .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; align-items: start; }
    /* 상단 영역도 카드와 같은 전체 폭으로 정렬 (가운데 몰림 방지) */
    .top-banner, .pref-card { max-width: 100%; }
    .meal-toggle { max-width: 560px; }   /* 토글 버튼만 과도하게 넓어지지 않게 살짝 제한(좌측 정렬) */
    .tabs { padding: 0 24px; }
  }

  .sub-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .sub-tab {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid #e2e8f0;
    background: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    color: #aaa;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sub-tab.active { background: #0a3d7a; border-color: #0a3d7a; color: #fff; }

  .date-group { margin-bottom: 22px; }
  .date-label {
    font-size: 0.74rem;
    font-weight: 700;
    color: #999;
    letter-spacing: 0.05em;
    margin-bottom: 9px;
  }
  .weather-comment {
    background: linear-gradient(135deg, #eef4fb, #e3eef9);
    border-left: 3px solid #0a3d7a;
    border-radius: 10px;
    padding: 10px 13px;
    margin-bottom: 10px;
    font-size: 0.82rem;
    color: #555;
    line-height: 1.5;
  }
  .cards { display: flex; flex-direction: column; gap: 9px; }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 13px 13px 13px 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    gap: 0;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .card:hover { box-shadow: 0 3px 14px rgba(0,0,0,0.1); }
  .card-stripe {
    width: 4px;
    flex-shrink: 0;
    background: #e2e8f0;
    margin-right: 11px;
  }
  .card.visited .card-stripe { background: #48bb78; }

  .card-emoji { font-size: 1.6rem; flex-shrink: 0; margin-right: 9px; align-self: flex-start; padding-top: 2px; }
  .card-body { flex: 1; min-width: 0; }
  .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .card-name { font-weight: 700; font-size: 0.95rem; }
  .badge { font-size: 0.67rem; padding: 2px 7px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .badge-cuisine { background: #ebf4ff; color: #2b6cb0; }
  .badge-review { background: #fff4d6; color: #b7791f; }
  .badge-new-review { background: #d3f9d8; color: #2f9e44; }
  .badge-tag { background: #ede9fe; color: #6b46c1; }
  .extra-head {
    font-size: 0.8rem; font-weight: 700; color: #6b46c1;
    margin: 16px 0 9px; padding-top: 13px;
    border-top: 1px dashed #e2e2ea;
  }
  .card.card-extra { background: #faf9ff; }
  .card.card-extra .card-stripe { background: #b794f4; }
  .card.card-nearby { background: #f2f8fd; }                 /* 📍 내 위치 주변 — 은은한 파랑 */
  .card.card-nearby .card-stripe { background: #4299e1; }
  .card.has-review .card-stripe { background: #f6b73c; }
  .modal-intro {
    background: #f0f5fb; border-radius: 10px; padding: 13px 15px;
    font-size: 0.93rem; color: #44566b; line-height: 1.6; margin-bottom: 14px;
  }
  .modal-menu {
    background: #fffaf0; border: 1px solid #f5e6c8; border-radius: 10px;
    padding: 11px 14px; margin-bottom: 14px;
  }
  .modal-menu .mm-head { font-size: 0.8rem; font-weight: 800; color: #b7791f; margin-bottom: 5px; }
  .modal-menu .mm-approx { font-size: 0.68rem; font-weight: 600; color: #c8a96b; }
  .modal-menu .mm-list { font-size: 0.88rem; color: #5a4a2a; line-height: 1.6; }
  /* 모달 상단 맛집 상세 정보 */
  .modal-detail {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
  }
  .modal-detail .md-chip {
    font-size: 0.83rem; padding: 6px 12px; border-radius: 20px;
    background: #f4f7fb; color: #44566b; font-weight: 600;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .modal-detail .md-map {
    margin-left: auto; font-size: 0.78rem; padding: 5px 12px; border-radius: 20px;
    border: 1.5px solid #03c75a; background: #fff; color: #03c75a;
    text-decoration: none; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .modal-detail .md-map:hover { background: #03c75a; color: #fff; }
  .modal-detail .md-map.nomap { border-color: #d0d0d0; background: #f3f3f3; color: #999; }
  .modal-reviews {
    margin-bottom: 14px; max-height: 34vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 9px;
    background: #f7f9fc; border: 1px solid #e9eef5; border-radius: 14px;
    padding: 13px;
  }
  .modal-reviews .mr-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 0.92rem; font-weight: 800; color: #0a3d7a;
    padding-bottom: 10px; margin-bottom: 2px; border-bottom: 1.5px solid #e3eaf3;
  }
  .modal-reviews .mr-head .mr-avg {
    margin-left: auto; font-size: 0.82rem; font-weight: 700; color: #d69e2e;
    background: #fff7e6; border: 1px solid #f5e3b8; border-radius: 20px; padding: 3px 10px;
  }
  .modal-reviews .review-item {
    background: #fff; border: 1px solid #edf1f6; border-radius: 11px;
    padding: 11px 13px; box-shadow: 0 1px 2px rgba(20,40,80,0.03);
  }
  .modal-reviews .review-name { font-size: 0.92rem; }
  .modal-reviews .review-content {
    font-size: 0.93rem; color: #3a4658; line-height: 1.6; margin-top: 5px;
  }
  .modal-reviews .review-stars { font-size: 0.88rem; }
  /* 리뷰 작성 섹션 */
  .modal-write {
    border-top: 2px dashed #e2e8f0; padding-top: 16px; margin-top: 4px;
  }
  .modal-write .mw-head {
    font-size: 0.92rem; font-weight: 800; color: #0a3d7a; margin-bottom: 12px;
  }
  .modal-row { display: flex; gap: 10px; }
  .modal-row .mf-name { flex: 1; margin-bottom: 11px; }
  .modal-row .mf-stars { flex-shrink: 0; margin-bottom: 11px; }

  .card-feature {
    font-size: 0.81rem; color: #555; margin-bottom: 6px; line-height: 1.45;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;   /* 최대 2줄 말줄임 (짧으면 1줄) */
  }
  .card-meta { display: flex; gap: 6px 11px; font-size: 0.75rem; color: #999; flex-wrap: wrap; align-items: center; }
  .card-meta span { white-space: nowrap; }

  /* 다중 리뷰 블록 */
  .reviews-block {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f3f3f3;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .review-item {
    background: #fafafa;
    border-radius: 9px;
    padding: 8px 10px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    position: relative;
  }
  .review-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #0a3d7a;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .review-right { flex: 1; min-width: 0; }
  .review-header { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; flex-wrap: wrap; }
  .review-name { font-size: 0.8rem; font-weight: 700; color: #333; }
  .review-stars { font-size: 0.75rem; white-space: nowrap; }
  .review-date { font-size: 0.68rem; color: #bbb; margin-left: auto; white-space: nowrap; }
  .review-content { font-size: 0.8rem; color: #555; line-height: 1.5; }
  .btn-del-review {
    background: none;
    border: none;
    cursor: pointer;
    color: #ccc;
    font-size: 0.85rem;
    padding: 2px 4px;
    border-radius: 4px;
    flex-shrink: 0;
    transition: color 0.13s, background 0.13s;
    line-height: 1;
  }
  .btn-del-review:hover { color: #e53e3e; background: #fff0f0; }
  .review-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .btn-edit-review {
    background: none; border: none; cursor: pointer; color: #bbb;
    font-size: 0.8rem; padding: 2px 4px; border-radius: 4px;
    transition: color 0.13s, background 0.13s; line-height: 1;
  }
  .btn-edit-review:hover { color: #0a3d7a; background: #eef4fb; }
  .no-reviews { font-size: 0.76rem; color: #ccc; padding: 2px 0; }

  /* 카드 하단 가로 액션바 — 작고 동글한 알약 버튼 */
  .card-actions {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f1f3f6;
  }
  /* 공통 버튼 스타일 — 내용 크기의 귀여운 알약 */
  .card-actions button, .card-actions .btn-map {
    flex: 0 0 auto;
    box-sizing: border-box;
    font-size: 0.68rem;
    padding: 4px 11px;
    border-radius: 999px;
    font-weight: 700;
    white-space: nowrap;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    background: #fff;
    transition: all 0.13s;
    border: 1.3px solid;
  }
  .btn-map { color: #03c75a; border-color: #03c75a; text-decoration: none; display: block; }
  .btn-map:hover { background: #03c75a; color: #fff; }
  .btn-review { color: #0a3d7a; border-color: #0a3d7a; }
  .btn-review:hover { background: #0a3d7a; color: #fff; }
  .btn-map.nomap { border-color: #d0d0d0; background: #f3f3f3; color: #999; cursor: default; }
  .btn-map.nomap:hover { background: #f3f3f3; color: #999; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  @media(min-width:400px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-num { font-size: 1.8rem; font-weight: 800; color: #0a3d7a; line-height: 1; }
  .stat-label { font-size: 0.72rem; color: #999; margin-top: 4px; }

  /* 끼니별 리뷰 통계 CSS는 아래 .meal-stats/.ms-row(단일 열 행) 정의 사용 — 옛 3열 그리드 잔재 제거 */

  /* 내 근처 맛집 검색 */
  .place-search-card { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 14px; }
  .place-head-row { display: flex; align-items: center; justify-content: space-between; }
  .place-refresh { background: none; border: none; cursor: pointer; font-size: 1rem; padding: 2px 6px; border-radius: 8px; }
  .place-refresh:hover { background: #f0f5fb; }
  .place-head-btns { display: flex; align-items: center; gap: 4px; }
  .place-close {
    background: #f1f3f6; border: none; cursor: pointer; color: #667;
    font-size: 0.74rem; font-weight: 600; padding: 5px 10px; border-radius: 8px; white-space: nowrap;
  }
  .place-close:hover { background: #e6534212; color: #e65342; }
  .place-search-row { display: flex; gap: 8px; margin-top: 10px; }
  .place-input {
    flex: 1; border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 9px 12px; font-size: 0.86rem; font-family: inherit; color: #333;
  }
  .place-input:focus { outline: none; border-color: #0a3d7a; }
  .place-btn {
    background: #0a3d7a; color: #fff; border: none; border-radius: 10px;
    padding: 9px 16px; font-size: 0.86rem; font-weight: 700; cursor: pointer; white-space: nowrap;
  }

  /* 리뷰 작성 모달 */
  /* 리뷰 = 전체 페이지 */
  .modal-bg {

    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #fff;

    height: 100vh; height: 100dvh;   /* 한 화면 가득 */
    display: flex;
    flex-direction: column;
  }
  .modal-head {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; background: #fff; border-bottom: 1px solid #eef1f5;

  .modal-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 18px; -webkit-overflow-scrolling: touch; }

  .modal-meal { display: flex; gap: 7px; }

  .review-meal { font-size: 0.66rem; padding: 1px 6px; border-radius: 10px; background: #eef2f7; color: #4a5568; font-weight: 600; }

  .modal textarea {
    width: 100%; height: 80px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;

  .modal-btns { display: flex; gap: 8px; margin-top: 11px; justify-content: flex-end; }
  .btn-cancel { background: #f5f5f5; color: #666; border: none; padding: 9px 16px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 0.86rem; }
  .btn-save { background: #0a3d7a; color: #fff; border: none; padding: 9px 16px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 0.86rem; }
  .saving-msg { font-size: 0.8rem; color: #888; margin-top: 8px; text-align: right; min-height: 18px; }
  /* 리뷰 사진 첨부 */
  .photo-attach { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn-photo {
    border: 1.5px dashed #b9c6d6; background: #f7f9fc; color: #4a6285;

  /* 시간대(점심/저녁/술집) 토글 */

  /* 컨디션 입력 */
  .pref-card {

    padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);

  /* 모바일에서 입력창 포커스 시 자동 확대(줌) 방지 — 폰트 16px 이상이면 iOS가 확대하지 않음 */

    try { localStorage.setItem('placeIntros', JSON.stringify(placeIntros)); localStorage.setItem('placeDetails', JSON.stringify(placeDetails)); } catch(e) {}
  } catch(e) {}
}
// 양쪽(카카오+네이버) 거리가 이미 채워졌는지
function hasDualDist(name) {
  const d = (placeDetails[name] || {}).distance || '';
  return /카카오/.test(d) && /네이버/.test(d);
}
async function fetchPlaceIntro(name) {
  // 소개·가격·양쪽거리·메뉴 모두 캐시됐으면 네트워크 호출 생략
  if (placeIntros[name] && (placeDetails[name]||{}).price && (placeDetails[name]||{}).menu && hasDualDist(name)) return placeIntros[name];
  if (_introPending[name]) return _introPending[name];
  const d = placeDetails[name] || {};
  _introPending[name] = (async () => {
    try {
      const res = await fetch(ANALYZE_URL, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ describe: name, cuisine: d.cuisine || '', address: d.address || '', ...locParams() })
      });
      const data = await res.json();
      // 가격·거리(카카오+네이버)·메뉴 보강 (일관성)
      if (data && (data.price || data.distance || data.menu)) {
        if (!placeDetails[name]) placeDetails[name] = { name };
        const pd = placeDetails[name];
        if (data.price && !pd.price) pd.price = data.price;
        if (data.menu && !pd.menu) pd.menu = data.menu;
        // 양쪽 출처 거리가 있으면 단일 출처 거리보다 우선
        if (data.distance && /카카오|네이버/.test(data.distance)) {
          pd.distance = data.distance;
          if (data.verified !== undefined) pd.verified = data.verified;
        }
        try { localStorage.setItem('placeDetails', JSON.stringify(placeDetails)); } catch(e) {}
      }
      if (data && data.intro && !isBadIntro(data.intro)) {
        placeIntros[name] = data.intro;
        try { localStorage.setItem('placeIntros', JSON.stringify(placeIntros)); } catch(e) {}
        return data.intro;
      }
    } catch(e) {}
    return '';
  })();
  return _introPending[name];
}

}

async function fetchPlaceDetail(name) {

      body: JSON.stringify({ query: name, lat: LOC().lat, lng: LOC().lng })
    });

const APP_VERSION = '1.0.1';   // 빌드 시 release.ps1이 갱신
function isNewerVersion(a, b) { // a > b ?
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] || 0, y = pb[i] || 0;
    if (x !== y) return x > y;
  }
  return false;
}
async function checkAppUpdate() {
  const cap = window.Capacitor;
  if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
  try {
    const r = await fetch('https://raw.githubusercontent.com/duelspost-droid/jblunch/master/version.json', { cache: 'no-store' });
    if (!r.ok) return;
    const v = await r.json();
    if (v && v.version && v.apk && isNewerVersion(v.version, APP_VERSION)) showUpdateBar(v);
  } catch (e) {}
}
function showUpdateBar(v) {
  if (document.getElementById('update-bar')) return;

async function setupDailyNotification() {
  try {
    const cap = window.Capacitor;
    if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
    const LN = cap.Plugins && cap.Plugins.LocalNotifications;
    if (!LN) return;
    const perm = await LN.requestPermissions();
    if (perm.display !== 'granted') return;
    // 중복 예약 방지: 기존 동일 id 취소 후 재등록
    await LN.cancel({ notifications: [{ id: 1101 }] }).catch(() => {});
    await LN.schedule({
      notifications: [{
        id: 1101,
        title: '🍽️ 오늘의 점심 추천',
        body: '여의도 JB빌딩 근처 맛집 추천이 준비됐어요. 확인해보세요!',

// GitHub raw(HTTPS)에서 최신 history.json을 받아 HISTORY_DATA를 갱신.
async function refreshHistoryForApp() {
  const isApp = !!(window.Capacitor) || location.protocol === 'capacitor:'
             || location.protocol === 'file:' || location.hostname === 'localhost';
  // index.html에는 최근 N일만 인라인 → 전체 이력을 런타임에 지연 하이드레이션.
  // 웹은 같은-오리진 상대경로(캐시 친화), 앱(file/capacitor)은 GitHub raw 절대경로.
  const url = isApp
    ? 'https://raw.githubusercontent.com/duelspost-droid/jblunch/master/history.json'
    : './history.json';
  try {
    const r = await fetch(url);
    if (!r.ok) return;
    const data = await r.json();
    const recs = Array.isArray(data) ? data : (data.recommendations || []);
    // 인라인(최근 N일)보다 많을 때만 교체 → 과거 이력/리뷰목록 보강
    if (recs.length > HISTORY_DATA.length) {
      HISTORY_DATA.splice(0, HISTORY_DATA.length, ...recs);
      renderHistory(); renderStats();
    }
  } catch (e) {}
}

// 리뷰는 있는데 상세정보가 없는 맛집(직접검색/주변검색)을 백엔드로 보강
async function backfillReviewedDetails() {
  const known = {};
  allRestaurants().forEach(r => { if (r.name) known[r.name] = 1; });
  // 서버 공유 캐시 일괄 로드 → 이미 생성된 맛집은 Claude 재호출 없이 즉시 표시
  const reviewed = Object.keys(commentsState).filter(n => (commentsState[n]||[]).length && !known[n]);
  await loadSharedMeta(reviewed);
  renderStats();
  const targets = Object.keys(commentsState).filter(n =>
    (commentsState[n] || []).length && !known[n] && !(placeDetails[n] && placeDetails[n].cuisine));
  for (const name of targets) {
    await fetchPlaceDetail(name);
    renderStats();
    await new Promise(r => setTimeout(r, 400));   // 백엔드 과부하 방지
  }
  // 소개·가격·양쪽거리가 부족한 리뷰 맛집 → 보강 (HISTORY 맛집 제외)
  const introTargets = Object.keys(commentsState).filter(n =>
    (commentsState[n] || []).length && !known[n] &&
    (!placeIntros[n] || !(placeDetails[n]||{}).price || !hasDualDist(n)));
  for (const name of introTargets) {
    await fetchPlaceIntro(name);
    renderStats();
    await new Promise(r => setTimeout(r, 1500));   // rate-limit 여유
  }
}

function emo(c) {
  if (!c) return '🍽️';
  if (c.includes('일식')) return '🍜';
  if (c.includes('한식')) return '🍲';
  if (c.includes('중식')) return '🥢';
  if (c.includes('버거')) return '🍔';
  return '🍽️';
}

function avatarColor(name) {
  const colors = ['#0a3d7a','#3182ce','#38a169','#805ad5','#d69e2e','#e53e3e','#319795'];
  let h = 0;
  for (let i=0; i<name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
  return colors[Math.abs(h) % colors.length];
}

function starsHtml(rating) {
  if (!rating) return '';
  return '⭐'.repeat(rating) + '<span style="opacity:0.3">☆</span>'.repeat(5 - rating);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ── 카드 그룹 렌더 (공통) ────────────────────────────────────
// bare=true: 날짜/날씨 헤더 없이 카드만 (홈 today-group용, 상단 배너와 중복 방지)
// 추천 태그 → 배지 라벨
const TAG_BADGE = {
  '근처유명': '⭐ 10분내 유명',
  '검색유명': '🔍 검색 인기',
  '신규맛집': '🆕 신규 오픈',
};

// 거리 간결화: "도보 1분 (카카오) / 1분 (네이버)" → "도보 1분" (다르면 "도보 5~6분")
// 거리 문자열이 차량 표기인지 (차로/차량/km 포함)
function isCarDist(d) { return /차로|차량|km/.test(String(d || '')); }
// 거리 아이콘: 차량이면 🚗, 도보면 🚶
function distIcon(d) { return isCarDist(d) ? '🚗' : '🚶'; }
function shortDistance(d) {
  const s = String(d || '');
  const nums = (s.match(/(\d+)\s*분/g) || []).map(x => parseInt(x));
  if (!nums.length) return s || '거리 미확인';
  const mn = Math.min(...nums), mx = Math.max(...nums);
  const unit = isCarDist(s) ? '차로' : '도보';
  let out = mn === mx ? `${unit} ${mn}분` : `${unit} ${mn}~${mx}분`;
  // 차량 표기는 km도 함께 보여줌 (가장 가까운 km)
  if (isCarDist(s)) {
    const kms = (s.match(/([\d.]+)\s*km/g) || []).map(x => parseFloat(x));
    if (kms.length) out += ` · ${Math.min(...kms)}km`;
  }
  return out;
}

// 최근 2일(48h) 내 새 리뷰가 달렸는지 — 카드/랭킹 '🆕 새 리뷰' 배지 공용
function hasNewReview(name) {
  const NEW_MS = 2 * 24 * 60 * 60 * 1000;
  return (commentsState[name] || []).some(c => { const t = c.created_at ? Date.parse(c.created_at) : NaN; return t && (Date.now() - t) < NEW_MS; });
}

function buildCard(r) {
  const cms = commentsState[r.name] || [];
  // 컨디션 추천 등 일부 항목은 cuisine/feature/price가 비어옴 → describe 캐시로 폴백
  const pd = placeDetails[r.name] || {};
  const dCuisine = r.cuisine || pd.cuisine || '';
  const dFeature = r.feature || placeIntros[r.name] || pd.feature || '';
  const dPrice = r.price || pd.price || '';
  const cnt = cms.length;
  const ratings = cms.map(c => c.rating).filter(Boolean);
  const avgStar = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : null;
  const reviewBadge = cnt ? `<span class="badge badge-review">⭐ ${avgStar || '-'} · 리뷰 ${cnt}</span>` : '';
  // 최근 2일 내 새 리뷰가 달린 가게엔 '신규' 배지 (hasNewReview 헬퍼 공용)
  const newReviewBadge = hasNewReview(r.name) ? `<span class="badge badge-new-review">🆕 새 리뷰</span>` : '';
  const tagBadge = r.tag && TAG_BADGE[r.tag] ? `<span class="badge badge-tag">${TAG_BADGE[r.tag]}</span>` : '';
  // 리뷰가 있을 때만 카드에 인라인 표시 (없으면 안 보임)
  const reviewsHtml = cnt ? `<div class="reviews-block">${cms.map(c => {
      const initial = (c.reviewer_name||'?').charAt(0).toUpperCase();
      const color = avatarColor(c.reviewer_name||'?');
      return `<div class="review-item">
        <div class="review-avatar" style="background:${color}">${initial}</div>
        <div class="review-right">
          <div class="review-header">
            <span class="review-name">${escHtml(c.reviewer_name)}</span>
            ${c.meal ? `<span class="review-meal">${escHtml(c.meal)}</span>` : ''}
            ${c.rating ? `<span class="review-stars">${starsHtml(c.rating)}</span>` : ''}
            <span class="review-date">${fmtDate(c.created_at)}</span>
          </div>
          ${c.content ? `<div class="review-content">${escHtml(c.content)}</div>` : ''}
          ${c.image_url ? `<div class="review-photo-wrap"><img class="review-photo" src="${escHtml(c.image_url)}" loading="lazy" onclick="event.stopPropagation();openPhoto('${escAttr(c.image_url)}')"></div>` : ''}
        </div>
        ${isMyComment(c.id) ? `<div class="review-actions">
          <button class="btn-edit-review" title="수정" onclick="editReview('${c.id}','${escAttr(r.name)}')">✏️</button>
          <button class="btn-del-review" title="삭제" onclick="confirmDelete('${c.id}','${escAttr(r.name)}')">✕</button>
        </div>` : ''}
      </div>`;
    }).join('')}</div>` : '';
  return `<div class="card ${cnt?'has-review':''}${r.tag?' card-extra':''}${r._nearby?' card-nearby':''}" id="c-${escAttr(r.name)}">
    <div class="card-stripe"></div>
    <div class="card-emoji">${emo(dCuisine)}</div>
    <div class="card-body">
      <div class="card-top">
        <span class="card-name">${escHtml(r.name)}</span>
        ${dCuisine ? `<span class="badge badge-cuisine">${escHtml(dCuisine)}</span>` : ''}
        ${tagBadge}
        ${reviewBadge}
        ${newReviewBadge}
      </div>
      ${dFeature ? `<div class="card-feature">${escHtml(dFeature)}</div>` : ''}
      <div class="card-meta">
        ${dPrice ? `<span>💰 ${escHtml(dPrice)}</span>` : ''}
        <span>${distIcon(r.distance)} ${escHtml(shortDistance(r.distance))}</span>
      </div>
      ${reviewsHtml}
      <div class="card-actions">
        ${r.verified === false
          ? `<span class="btn-map nomap" title="지도에서 확인되지 않은 가게입니다">🚫 지도없음</span>`
          : `<button class="btn-map" onclick="openMapRoute('${escAttr(r.name)}')">${isCarDist(r.distance)?'🚗':'🚶'} 경로</button>`}
        <button class="btn-review" onclick="openModal('${escAttr(r.name)}','${escAttr(r.feature)}')">📝 ${cnt?'리뷰 '+cnt:'리뷰'}</button>

// JB금융지주 주가 → 배너에 표시 (네이버 금융 프록시). 한 번만 fetch하고 캐시.
// renderHistory가 배너(#tb-stock 포함)를 재생성할 때마다 loadStock()을 다시 불러 캐시로 즉시
// 재렌더한다. (예전엔 초기 1회만 호출 → 이후 배너 재렌더로 #tb-stock이 빈 채 남아 주가가 안 나옴)
let _stockData = null;       // 조회 결과 캐시
let _stockFetching = false;  // 중복 fetch 방지
function _renderStock() {
  const el = document.getElementById('tb-stock');
  if (!el || !_stockData) return;
  const d = _stockData;
  const up = d.direction === 'RISING', down = d.direction === 'FALLING';
  const cls = up ? 'up' : (down ? 'down' : 'flat');
  const arrow = up ? '▲' : (down ? '▼' : '–');
  const rate = (d.changeRate !== '' && d.changeRate != null) ? `${d.changeRate > 0 ? '+' : ''}${d.changeRate}%` : '';
  const open = d.marketStatus === 'OPEN';
  el.innerHTML = `
    <span class="tb-stock-head">📈 JB금융지주</span>
    <span class="tb-stock-price">${escHtml(d.price)}원</span>
    <span class="tb-stock-change ${cls}">${arrow} ${escHtml(String(d.change).replace('-',''))} (${escHtml(rate)})</span>
    <span class="tb-stock-mk ${open ? 'live' : ''}">${open ? '● 장중' : '종가'}</span>`;
}
async function loadStock() {
  const el = document.getElementById('tb-stock');
  if (!el) return;
  if (_stockData) { _renderStock(); return; }   // 캐시 있으면 즉시 렌더(재fetch 없음)
  if (_stockFetching) return;                    // 이미 조회 중이면 대기
  _stockFetching = true;
  el.innerHTML = `<span class="tb-stock-head">📈 JB금융지주</span><span class="tb-stock-loading">시세 불러오는 중…</span>`;
  try {
    const res = await fetch(STOCK_URL, { headers: SB_HEADERS });
    const d = await res.json();
    if (!d || !d.price || d.error) { el.innerHTML = ''; return; }
    _stockData = d;
    _renderStock();
  } catch(e) { el.innerHTML = ''; }
  finally { _stockFetching = false; }
}

let currentMeal = '점심';     // 점심 / 저녁 / 술집
let customResult = null;       // {label, comment, restaurants}
const MEAL_EMOJI = { '점심':'🍚', '저녁':'🌙', '술집':'🍺' };

// 자유 입력 추천
function applyFreeText() {
  const text = document.getElementById('pref-text').value.trim();

// 백엔드(Edge Function) 호출로 맞춤 맛집 생성 후 화면 업데이트
async function generateRecommend(text, meal, saveHist) {
  track('custom_recommend', `${meal} / ${text}`);
  const answerEl = document.getElementById('pref-answer');
  const progEl = document.getElementById('pref-progress');
  const fill = document.getElementById('pref-progress-fill');
  const progText = document.getElementById('pref-progress-text');
  const btn = document.getElementById('pref-btn');

  answerEl.classList.remove('show');
  if (btn) btn.disabled = true;
  progEl.classList.add('show');
  fill.style.width = '0%';

  const steps = [
    { t: `${MEAL_EMOJI[meal]} ${meal} 자리 분석 중…`, w: 30 },
    { t: 'AI가 취향 파악 중…', w: 60 },
    { t: '맞춤 맛집 선별 중…', w: 85 },
  ];
  let i = 0;
  let progTimer = setInterval(() => {
    if (i < steps.length) { progText.textContent = steps[i].t; fill.style.width = steps[i].w + '%'; i++; }
  }, 400);

  let comment = '', restaurants = null, extras = [], ok = false, errMsg = '', kind = 'condition';
  try {
    const res = await fetch(ANALYZE_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, meal, ...locParams() })
    });
    const data = await res.json();
    comment = data.comment || '';
    restaurants = Array.isArray(data.restaurants) ? data.restaurants : null;
    extras = Array.isArray(data.extras) ? data.extras : [];
    kind = data.kind || 'condition';
    var placeFound = (kind === 'place') ? (data.found !== false) : true;
    var wantedName = data.wanted || text;
    if (data.error) errMsg = data.message || (data.error === 'rate_limited' ? 'AI 요청이 잠시 몰렸어요. 30초 후 다시 시도해주세요.' : '');
    ok = !!(restaurants && restaurants.length);
  } catch (e) { ok = false; }

  clearInterval(progTimer);
  fill.style.width = '100%';
  progText.textContent = '완료!';

  setTimeout(() => {
    progEl.classList.remove('show');
    if (btn) btn.disabled = false;

    if (ok) {
      let label, headComment = comment;
      if (!text) label = `${MEAL_EMOJI[meal]} 오늘의 ${meal} 추천`;
      else if (kind === 'place' && !placeFound) {
        label = `🔎 "${wantedName}" — 근처에서 못 찾았어요`;
        headComment = `${wantedName}을(를) 이 근처에서 찾지 못했어요. 대신 비슷한 분위기의 가까운 곳을 보여드릴게요.`;
      }
      else label = (kind === 'place') ? `🔎 "${text}" · 정보와 비슷한 곳` : `🔎 "${text}" 맞춤 추천`;
      customResult = { label, comment: headComment, restaurants, extras, kind };
      cachePlaces([...(restaurants||[]), ...(extras||[])]);
      answerEl.innerHTML = `<div class="pa-head">${escHtml(label)}</div>${escHtml(headComment)}`;
      answerEl.classList.add('show');
      renderCustomGroup();
      if (saveHist && text) addHistory(text);
    } else if (errMsg) {
      answerEl.innerHTML = `<div class="pa-head">⏳ 잠시만요</div>${escHtml(errMsg)}`;
      answerEl.classList.add('show');
    } else {
      answerEl.innerHTML = `<div class="pa-head">⚠️ 추천 생성 실패</div>네트워크 문제로 맞춤 추천을 못 가져왔어요. 잠시 후 다시 시도해주세요.`;
      answerEl.classList.add('show');
    }
  }, 300);
}

// 오늘 데이터 / 시간대별 데이터 추출
function getDay() {
  const sorted = [...histData()].sort((a,b) => b.date.localeCompare(a.date));
  return sorted.find(g => g.by_condition) || sorted[0];
}
function getMealData(day, meal) {
  if (!day) return null;
  if (meal === '점심') return { restaurants: day.restaurants, by_condition: day.by_condition, extras: day.extras };
  return (day.meals && day.meals[meal]) || null;
}

// 컨디션 칩 표시/숨김 + 선택 동기화 (JB=by_condition 있을 때 / 은행=항상 노출)
function updateCondChips() {
  const md = getMealData(getDay(), currentMeal);
  // 끼니별 칩 노출: data-meals에 현재 끼니가 포함된 칩만 표시(술집엔 술집 전용 칩만)
  document.querySelectorAll('.pref-chips .pref-chip').forEach(c => {
    const meals = (c.dataset.meals || '점심,저녁,술집').split(',');
    c.style.display = meals.includes(currentMeal) ? '' : 'none';
  });
  // 행 표시: 술집은 사전생성 by_condition이 없어도 전용 컨디션을 실시간 추천하므로 항상 노출.
  const hasCond = currentMeal === '술집' || !useBatch() ||
    !!(md && md.by_condition && Object.keys(md.by_condition).length);
  const wrap = document.querySelector('.pref-chips');
  if (wrap) wrap.style.display = hasCond ? 'flex' : 'none';
  syncCondChips();
}
// 은행 거점: 실시간(analyze)으로 현재 끼니·컨디션 추천 로드

// 시간대 토글 (점심/저녁/술집) — 모두 미리 생성된 데이터 사용

// 컨디션 칩 다중선택: 기본(='')은 모두 해제, 그 외는 토글
function selectCond(el) {
  const cond = el.dataset.cond;
  locMode = false;          // 컨디션 선택 시 내 위치 모드 해제

  if (cond === '') {
    currentConds = [];                       // 기본 = 해당사항 없음 (전부 해제)
  } else {
    const i = currentConds.indexOf(cond);
    if (i >= 0) {
      currentConds.splice(i, 1);             // 이미 켜져 있으면 끔
    } else if (currentConds.length >= 2) {
      showToast('컨디션은 최대 2개까지 선택할 수 있어요');
      return;                                // 3개째는 막음 (상태 변화 없음)
    } else {
      currentConds.push(cond);               // 추가
    }
  }
  syncCondChips();
  applyConds();

// 칩 on/off 표시 갱신 (기본은 선택 0개일 때만 on)
function syncCondChips() {
  document.querySelectorAll('.pref-chip').forEach(c => {
    if (c.dataset.loc) { c.classList.toggle('on', locMode); return; }   // 📍 내 위치 칩
    const cc = c.dataset.cond;
    c.classList.toggle('on', !locMode && (cc === '' ? currentConds.length === 0 : currentConds.includes(cc)));

// 선택 상태에 따라 추천 갱신: 0개=기본, 1개=미리생성(없으면 백엔드), 2개↑=조합 백엔드
function applyConds() {
  if (!useBatch()) {           // 배치 없는 위치: 컨디션 조합을 실시간 추천으로
    currentCond = currentConds.length === 1 ? currentConds[0] : '';
    loadBankRecommend();
    return;
  }
  const md = getMealData(getDay(), currentMeal);
  if (currentConds.length === 0) {
    currentCond = '';
    renderCondGroup();
  } else if (currentConds.length === 1) {
    const c = currentConds[0];
    currentCond = c;
    if (md && md.by_condition && md.by_condition[c]) renderCondGroup();
    else generateRecommend(c, currentMeal, false);
  } else {
    // 여러 컨디션 조합 → 백엔드로 맞춤 추천
    currentCond = '';
    generateRecommend(currentConds.join(', '), currentMeal, false);
  }
}

function renderCondGroup() {
  if (customResult) { renderCustomGroup(); return; }
  const day = getDay();
  const md = getMealData(day, currentMeal);
  if (!md || !md.restaurants || !md.restaurants.length) {
    document.getElementById('today-group').innerHTML =
      `<div class="empty">아직 ${currentMeal} 추천 데이터가 없어요.<br>아래 직접 입력으로 추천받아보세요!</div>`;
    return;
  }
  const isBase = !(currentCond && md.by_condition && md.by_condition[currentCond]);
  const restaurants = isBase ? md.restaurants : md.by_condition[currentCond];
  // 추가 추천(extras)은 기본(컨디션 미선택) 보기에서만 노출
  const extras = isBase ? md.extras : null;
  document.getElementById('today-group').innerHTML = renderGroup({ date: day.date, restaurants, extras }, true);
  // 컨디션 추천처럼 cuisine/feature/price가 비어온 항목 → 백엔드 캐시로 보강 후 재렌더
  backfillCardDetails(restaurants, extras, day.date);
}

// 카드에 소개/종류/가격이 비어있는 맛집을 describe 캐시로 보강하고 같은 그룹을 재렌더
let _cardBackfillToken = 0;
async function backfillCardDetails(restaurants, extras, date) {
  const need = (restaurants || []).filter(r => r && r.name && (!r.feature || !r.cuisine || !r.price)
    && !(placeIntros[r.name] && (placeDetails[r.name]||{}).cuisine && (placeDetails[r.name]||{}).price));
  if (!need.length) return;
  const token = ++_cardBackfillToken;                 // 메뉴/컨디션 바뀌면 중단
  const snapMeal = currentMeal, snapCond = currentCond;
  for (const r of need) {
    await fetchPlaceDetail(r.name);                   // cuisine/주소/거리
    await fetchPlaceIntro(r.name);                    // feature/price/menu
    if (token !== _cardBackfillToken || currentMeal !== snapMeal || currentCond !== snapCond) return;
    const el = document.getElementById('today-group');
    if (el && !customResult) el.innerHTML = renderGroup({ date, restaurants, extras }, true);
    await new Promise(res => setTimeout(res, 350));
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  // 인라인 onclick="fn('${escAttr(x)}')" 의 JS 문자열 + HTML 속성 두 맥락 모두 안전하게.
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')                 // 역슬래시 먼저 — JS 문자열 이스케이프 보호
    .replace(/'/g, "\\'")                    // 홑따옴표 → JS 문자열 탈출 차단
    .replace(/"/g, '&quot;')                 // 큰따옴표 → HTML 속성 경계 탈출 차단
    .replace(/[\r\n]/g, ' ');    // 개행 제거 → JS 문자열 깨짐 방지
}

// 이미지 클라이언트 압축 (최대변 1280px, JPEG)
function compressImage(file, maxDim = 1280, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (Math.max(w, h) > maxDim) { const s = maxDim / Math.max(w, h); w = Math.round(w*s); h = Math.round(h*s); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(b => b ? resolve(b) : reject(new Error('compress')), 'image/jpeg', quality);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error('image load'));
    img.src = URL.createObjectURL(file);
  });
}
async function onPhotoSelect(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!/^image\//.test(file.type)) { showToast('⚠️ 이미지 파일만 첨부할 수 있어요'); input.value=''; return; }
  try {
    const blob = await compressImage(file);
    mPhotoBlob = blob; mPhotoUrl = '';
    const url = URL.createObjectURL(blob);
    document.getElementById('photo-preview-img').src = url;
    document.getElementById('photo-preview').style.display = 'block';
    document.getElementById('btn-photo').textContent = '📷 사진 변경';
  } catch (e) { showToast('⚠️ 사진 처리 실패'); }
  input.value = '';
}

// 이름으로 맛집 상세정보 찾기 (커스텀 결과 → 일별 데이터 순)
function findRestaurant(name) {
  if (customResult) {
    const all = [...(customResult.restaurants||[]), ...(customResult.extras||[])];
    const hit = all.find(r => r.name === name);
    if (hit) return hit;
  }
  const inSearch = (searchedPlaces || []).find(r => r.name === name);
  if (inSearch) return inSearch;
  const inHist = allRestaurants().find(r => r.name === name);
  if (inHist) return inHist;
  return placeDetails[name] || null;
}

// 모달 상단 상세정보(칩 + 주소 + 지도) 렌더 — info 없으면 이름만으로 지도 제공
function renderModalDetail(name, info) {
  const detailEl = document.getElementById('modal-detail');
  if (!detailEl) return;
  info = info || {};
  const chips = [];
  if (info.cuisine) chips.push(`<span class="md-chip">${emo(info.cuisine)} ${escHtml(info.cuisine)}</span>`);
  if (info.price) chips.push(`<span class="md-chip">💰 ${escHtml(info.price)}</span>`);
  if (info.distance) chips.push(`<span class="md-chip">${distIcon(info.distance)} ${escHtml(info.distance)}</span>`);
  if (info.address) chips.push(`<span class="md-chip">📍 ${escHtml(info.address)}</span>`);
  const mapBtn = info.verified === false
    ? `<span class="md-map nomap" title="지도 미등록">🚫 지도없음</span>`
    : `<button class="md-map" onclick="openMapRoute('${escAttr(name)}')">${isCarDist(info.distance)?'🚗 자동차경로':'🚶 도보경로'}</button>`;
  detailEl.innerHTML = chips.join('') + mapBtn;
  detailEl.style.display = 'flex';
}
function openModal(name, feature, editC) {
  mId = name; mRating = editC ? (editC.rating || 0) : 0; mFeature = feature || '';
  mEditId = editC ? editC.id : null;
  // 끼니 기본값: 수정이면 기존 값, 아니면 현재 보고 있는 시간대

        : ((typeof currentMeal !== 'undefined' && currentMeal) ? currentMeal : '점심');

function fmtPhone(p) { return (p || '').replace(/[^0-9+]/g, ''); }

// 경로 출발지 = 선택한 기준 위치 (JB빌딩/광주은행/…)
// 이동수단(도보/자동차)은 해당 가게 거리 표기(차로/도보) 기준으로 자동 결정.
// 거리 정보가 없으면 위치의 추천 방식(차량 계열)으로 판단.
function routeIsCar(name) {
  const d = (placeDetails[name] || {}).distance || '';
  if (d) return isCarDist(d);
  const p = LOC().rec_profile;
  if (['drive_near', 'drive', 'wide'].includes(p)) return true;
  if (p === 'custom' && LOC().rec_custom && Number(LOC().rec_custom.walkMax) <= 7) return true;
  return false;
}
function routeWord(car) { return car ? '자동차' : '도보'; }
// 경로 출발지: 내 위치(GPS)로 검색·보기 중이면 현재 GPS 좌표, 아니면 선택 기준위치(JB빌딩 등).
// (예전엔 항상 기준위치라, '내 위치' 검색 후 길찾기 시 출발이 회사로 잡히던 버그)
function routeOrigin() {
  if (myPos && (locMode || placeOrigin === '현위치')) {
    return { lat: myPos.lat, lng: myPos.lng, short: '내 위치' };
  }
  return { lat: LOC().lat, lng: LOC().lng, short: LOC().short };
}
// 구글지도 키리스 임베드(output=embed): iframe 안에서 렌더 → 외부 앱 호출 없음
function routeEmbedUrl(name, lng, lat, car) {
  const o = routeOrigin();
  const saddr = `${o.lat},${o.lng}`;
  const daddr = (lng && lat) ? `${lat},${lng}(${name})` : `${name} ${LOC().region}`;
  return `https://maps.google.com/maps?saddr=${encodeURIComponent(saddr)}&daddr=${encodeURIComponent(daddr)}&dirflg=${car ? 'd' : 'w'}&hl=ko&output=embed`;
}
// 새 탭용(임베드가 막힐 때 대비) — 역시 웹
function routeWebUrl(name, lng, lat, car) {
  const org = routeOrigin();
  const o = `${org.lat},${org.lng}`;
  const d = (lng && lat) ? `${lat},${lng}` : `${name} ${LOC().region}`;
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(d)}&travelmode=${car ? 'driving' : 'walking'}&hl=ko`;
}
function closeRoute() {
  const bg = document.getElementById('route-bg');
  document.getElementById('route-frame').src = 'about:blank';
  bg.style.display = 'none';
}
function showRoute(name, lng, lat) {
  const car = routeIsCar(name);
  document.getElementById('route-title').textContent = `${car ? '🚗' : '🚶'} ${routeOrigin().short} → ${name}`;
  document.getElementById('route-frame').src = routeEmbedUrl(name, lng, lat, car);
  document.getElementById('route-ext').href = routeWebUrl(name, lng, lat, car);
  document.getElementById('route-bg').style.display = 'flex';
}
// 네이버 지도 웹 길찾기 URL (출발: 선택 위치 → 목적지, 도보/자동차)
function naverRouteUrl(name, lng, lat, car) {
  const org = routeOrigin();
  const start = `${org.lng},${org.lat},${encodeURIComponent(org.short)},,`;
  return (lng && lat)
    ? `https://map.naver.com/p/directions/${start}/${lng},${lat},${encodeURIComponent(name)},,/-/${car ? 'car' : 'walk'}`
    : `https://map.naver.com/p/search/${encodeURIComponent(name + ' ' + LOC().region)}`;
}
// 경로: 네이버 지도 웹(새 탭)에서 출발지·목적지 찍어 보여줌 (앱/임베드 X)
async function openMapRoute(name) {
  const c = placeDetails[name] || {};
  if (c.lat && c.lng) { window.open(naverRouteUrl(name, c.lng, c.lat, routeIsCar(name)), '_blank', 'noopener'); return; }
  // 좌표 미보유: 빈 새 탭 먼저 열어 클릭 제스처 유지 → 좌표 조회 후 경로로 이동
  const w = window.open('about:blank', '_blank');
  await fetchPlaceDetail(name);
  const cc = placeDetails[name] || {};
  const url = naverRouteUrl(name, cc.lng, cc.lat, routeIsCar(name));
  if (w && !w.closed) w.location.href = url;
  else window.open(url, '_blank', 'noopener');
}
// 공유하기: 우리 사이트의 해당 맛집 리뷰로 바로 연결되는 링크 + 리뷰 요약
async function openShare(name) {
  // 쿼리 파라미터(?r=) — 해시보다 공유 앱 전달이 안정적
  const url = `${location.origin}${location.pathname}?r=${encodeURIComponent(name)}`;
  // 리뷰·가게정보 요약 → 정교한 공유 카드 텍스트 (종류·평점·가격·거리·소개)
  const cms = commentsState[name] || [];
  const rs = cms.map(c => c.rating).filter(Boolean);
  const avg = rs.length ? (rs.reduce((a, b) => a + b, 0) / rs.length).toFixed(1) : null;
  const info = (typeof findRestaurant === 'function' ? findRestaurant(name) : null) || placeDetails[name] || {};
  const cuisine = (info.cuisine || '').trim();
  const price = (info.price || '').trim();
  const distance = (info.distance || '').trim();
  const intro = (placeIntros[name] || info.feature || '').trim().slice(0, 90);
  const emoji = (typeof emo === 'function' ? emo(cuisine) : '🍽️');

  const lines = [`${emoji} ${name}${cuisine ? `  ·  ${cuisine}` : ''}`];
  if (avg) lines.push(`⭐ ${avg}  ·  리뷰 ${cms.length}개`);
  else if (cms.length) lines.push(`💬 리뷰 ${cms.length}개`);
  const meta = [];
  if (price) meta.push(`💰 ${price}`);
  if (distance) meta.push(`${typeof distIcon === 'function' ? distIcon(distance) : '🚶'} ${distance}`);
  if (meta.length) lines.push(meta.join('  ·  '));
  if (intro) lines.push(`\n“${intro}”`);
  lines.push(`\n📲 여의나루 점심 맛집 트래커 — 리뷰·지도·예약 보기`);   // URL은 아래 url 필드로만
  const body = lines.join('\n');
  if (navigator.share) {
    // url을 전용 필드로만 전달(text엔 URL 미포함) → 공유 대상에서 링크가 두 번 나오지 않음
    try { await navigator.share({ title: name, text: body, url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }  // 사용자가 취소
  }
  // 폴백: 클립보드 복사 (본문 + URL 한 번)
  try {
    await navigator.clipboard.writeText(`${body}\n${url}`);
    showToast('🔗 리뷰 링크가 복사되었어요!');
    return;
  } catch (e) {}
  window.prompt('아래 리뷰 링크를 복사하세요', url);
}
// 공유 링크(?r=맛집명 또는 #r=맛집명)로 들어오면 해당 맛집 리뷰 모달 자동 오픈
function openFromHash() {
  let name = '';
  try {
    const q = new URLSearchParams(location.search).get('r');
    if (q) name = q;
  } catch (e) {}
  if (!name) {
    const m = (location.hash || '').match(/^#r=(.+)$/);
    if (m) { try { name = decodeURIComponent(m[1]); } catch (e) { name = m[1]; } }
  }
  if (name && typeof openModal === 'function') openModal(name, '');
}
// 네이버 플레이스(예약·메뉴·전화가 있는 실제 가게 페이지)로 이동

async function fetchPlacePhone(name) {
  if (placeDetails[name] && placeDetails[name].phone) return placeDetails[name].phone;
  try {
    const res = await fetch(PLACES_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: name })
    });
    const data = await res.json();
    const list = Array.isArray(data.places) ? data.places : [];
    const hit = list.find(p => p.name === name) || list.find(p => p.name && p.name.includes(name)) || list[0];
    if (hit) { cachePlace(hit); return hit.phone || ''; }
  } catch(e) {}
  return '';
}

    document.getElementById('saving-msg').textContent = '⚠️ 이름을 입력해주세요.';
    document.getElementById('modal-name').focus();
    return;
  }
  if (!text && !mRating) {
    document.getElementById('saving-msg').textContent = '⚠️ 별점 또는 리뷰 내용을 입력해주세요.';
    return;
  }

  const btn = document.getElementById('btn-save');
  const msg = document.getElementById('saving-msg');
  btn.disabled = true;

  try {
    // 새 사진이 첨부됐으면 먼저 업로드 → image_url 결정
    let imageUrl = mPhotoUrl;   // 기존 유지(수정) 또는 ''(삭제)
    if (mPhotoBlob) {
      msg.textContent = '사진 업로드 중…';
      imageUrl = await uploadReviewPhoto(mPhotoBlob);
    }
    msg.textContent = mEditId ? '수정 중…' : '저장 중…';
    if (mEditId) {
      const updated = await updateComment(mEditId, name, text, mRating, mMeal, imageUrl);
      const arr = commentsState[mId] || [];
      const i = arr.findIndex(c => String(c.id) === String(mEditId));
      if (i >= 0) arr[i] = updated;
      setBadge('ok', '☁️ 동기화됨');
      track('review_edit', `${mId} / ${name}`);
      closeModal();
      renderHistory(); renderStats();
      showToast('✏️ 리뷰가 수정되었습니다!');
    } else {
      const newComment = await insertComment(mId, name, text, mRating, mMeal, imageUrl);
      if (!commentsState[mId]) commentsState[mId] = [];
      commentsState[mId].push(newComment);
      setBadge('ok', '☁️ 동기화됨');
      track('review_create', `${mId} / ${name} / ★${mRating} / ${mMeal}`);
      closeModal();
      renderHistory(); renderStats();
      showToast('✅ 리뷰가 저장되었습니다!');
    }
  } catch(e) {
    msg.textContent = '⚠️ 저장 실패. 다시 시도해주세요.';
    btn.disabled = false;
    setBadge('err', '⚠️ 저장 실패');
  }
}

// ── 리뷰 삭제 ─────────────────────────────────────────────────
async function confirmDelete(commentId, restaurantId) {
  if (!confirm('이 리뷰를 삭제하시겠습니까?')) return;
  setBadge('loading', '삭제 중…');
  track('review_delete', `${restaurantId}`);
  try {
    await deleteComment(commentId);
    if (commentsState[restaurantId]) {
      commentsState[restaurantId] = commentsState[restaurantId].filter(c => c.id !== commentId);
    }
    renderHistory(); renderStats();
    setBadge('ok', '☁️ 동기화됨');
    showToast('🗑️ 리뷰가 삭제되었습니다.');
    if (mId === restaurantId) openModal(mId, mFeature);
  } catch {
    setBadge('err', '⚠️ 삭제 실패');
    showToast('⚠️ 삭제에 실패했습니다. 다시 시도해주세요.');
  }
}

// ── 통계 ──────────────────────────────────────────────────────
// 모든 시간대·컨디션의 맛집을 평탄화 (점심/저녁/술집 + by_condition)
function allRestaurants() {
  const out = [];
  HISTORY_DATA.forEach(day => {
    const buckets = [];
    if (day.restaurants) buckets.push(day.restaurants);
    if (day.by_condition) buckets.push(...Object.values(day.by_condition));
    if (day.meals) Object.values(day.meals).forEach(m => {
      if (m && m.restaurants) buckets.push(m.restaurants);
      if (m && m.by_condition) buckets.push(...Object.values(m.by_condition));
    });
    buckets.forEach(b => b.forEach(r => out.push(r)));
  });
  return out;
}

// ── 끼니별 리뷰 통계 (Phase 3) ────────────────────────────────
let statMealFilter = '전체';   // '전체' | '점심' | '저녁' | '술집'

// commentsState(가게명→리뷰[])에서 끼니별 집계
function mealStats() {
  const meals = ['점심', '저녁', '술집'];
  return meals.map(m => {
    const perR = {};
    let count = 0, sum = 0, n = 0;
    Object.entries(commentsState).forEach(([name, cms]) => {
      (cms || []).forEach(c => {
        if ((c.meal || '') !== m) return;
        count++;
        const o = (perR[name] || (perR[name] = { sum: 0, n: 0, cnt: 0 }));
        o.cnt++;
        if (c.rating) { o.sum += c.rating; o.n++; sum += c.rating; n++; }
      });
    });
    let top = null, best = -1;
    Object.entries(perR).forEach(([name, o]) => {
      const score = (o.n ? o.sum / o.n : 0) + o.cnt * 0.1;   // 평점 + 횟수 가중
      if (score > best) { best = score; top = name; }
    });
    return { meal: m, count, avg: n ? sum / n : 0, top };
  });
}

function mealStatsHtml() {
  const icon = { '점심': '🍚', '저녁': '🌙', '술집': '🍺' };
  const rows = mealStats().map(s => {
    if (!s.count) {
      return `<div class="ms-row dim"><span class="ms-meal">${icon[s.meal]} ${s.meal}</span><span class="ms-sub">아직 리뷰 없음</span></div>`;
    }
    const on = statMealFilter === s.meal ? ' on' : '';
    return `<div class="ms-row${on}" onclick="filterByMeal('${s.meal}')">
        <span class="ms-meal">${icon[s.meal]} ${s.meal}</span>
        <span>리뷰 ${s.count} · ★${s.avg.toFixed(1)}</span>
        ${s.top ? `<span class="ms-sub">· 1위 ${escHtml(s.top)}</span>` : ''}
      </div>`;
  }).join('');
  const chips = ['전체', '점심', '저녁', '술집'].map(m =>
    `<span class="meal-chip${statMealFilter === m ? ' on' : ''}" onclick="filterByMeal('${m}')">${m}</span>`
  ).join('');
  return `<div class="meal-stats">${rows}</div><div class="meal-chips">${chips}</div>`;
}

function filterByMeal(m) {
  // 같은 끼니 재클릭 → 전체 해제. '전체' 클릭 → 전체.
  statMealFilter = (m === '전체' || statMealFilter === m) ? '전체' : m;
  renderStats();
}

function renderStats() {
  const allR = allRestaurants();
  const byName = {};
  allR.forEach(r => { if (r.name && !byName[r.name]) byName[r.name] = r; });
  const uniqueNames = new Set(allR.map(r => r.name)).size;

  const allComments = Object.values(commentsState).flat();
  const ratings = allComments.map(c => c.rating).filter(Boolean);
  const avg = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '-';

  // 끼니별(점심/저녁/술집) 리뷰 수 + 평균 별점 — 현재 위치 기준
  // 리뷰가 있는 모든 맛집 (HISTORY_DATA에 없어도 — 직접검색·주변검색 포함)
  // statMealFilter 적용: '전체'면 모든 리뷰, 아니면 해당 끼니 리뷰만 집계/노출
  const mealOf = (cms) => statMealFilter === '전체'
    ? (cms || [])
    : (cms || []).filter(c => (c.meal || '') === statMealFilter);
  const topList = Object.keys(commentsState)
    .map(name => ({ name, cms: mealOf(commentsState[name]) }))
    .filter(x => x.cms.length)
    .map(({ name, cms }) => {
      const rs = cms.map(c => c.rating).filter(Boolean);
      const av = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 0;
      const base = byName[name] || placeDetails[name] || {};
      return {
        name,
        cuisine: base.cuisine || '',
        feature: placeIntros[name] || base.feature || '',
        price: base.price || '',
        distance: base.distance || '',
        address: base.address || '',
        verified: base.verified,
        avg: av,
        cnt: cms.length,
        rated: rs.length > 0
      };
    })
    .sort((a, b) => (b.avg - a.avg) || (b.cnt - a.cnt));

  // 내 주변 맛집 카드 — 버튼 클릭(목록 로드) 후에만 검색창 노출
  const placeOpened = nearbyLoaded || !!placeSearchQ;
  const searchRow = placeOpened ? `
      <div class="place-search-row">
        <input class="place-input" id="place-q" value="${escHtml(placeSearchQ)}"
               placeholder="이름으로 찾기 (예: 스타벅스, 소몽)" maxlength="30"
               onkeydown="if(event.key==='Enter')searchPlaces()">
        <button class="place-btn" id="place-btn" onclick="searchPlaces()">검색</button>
      </div>` : '';
  const searchHtml = `
    <div class="place-search-card">
      <div class="place-head-row">
        <div class="pref-title" style="margin:0">📍 내 주변 맛집에 리뷰 남기기</div>
        ${placeOpened ? `<div class="place-head-btns">
          <button class="place-refresh" onclick="loadNearby(true)" title="새로고침">🔄</button>
          <button class="place-close" onclick="closeNearby()">✕ 리스트 닫기</button>
        </div>` : ''}
      </div>
      ${searchRow}
      <div id="place-results">${renderPlaceResults()}</div>
    </div>`;

  document.getElementById('tab-stats').innerHTML = `
    <div class="stats-grid" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat-card"><div class="stat-num">${allComments.length}</div><div class="stat-label">총 리뷰 수</div></div>
      <div class="stat-card"><div class="stat-num">${avg}</div><div class="stat-label">평균 별점</div></div>
    </div>
    ${searchHtml}
    ${mealStatsHtml()}
    <div class="top-list">
      <h3>⭐ 리뷰 맛집${statMealFilter !== '전체' ? ` · ${statMealFilter}` : ''} (평균 별점순) · 눌러서 리뷰 보기</h3>
      ${topList.length ? topList.map((r,i) => `<div class="top-item" onclick="openModal('${escAttr(r.name)}','${escAttr(r.feature||'')}')">
        <div class="top-rank">${i+1}</div>
        <div class="top-info">
          <div class="top-name">${emo(r.cuisine)} ${escHtml(r.name)} <span class="top-stars-inline">${r.rated ? `${'⭐'.repeat(Math.round(r.avg))} <small>${r.avg.toFixed(1)}</small> · ` : ''}리뷰 ${r.cnt}</span>${hasNewReview(r.name) ? ` <span class="badge badge-new-review">🆕 새 리뷰</span>` : ''}</div>
          <div class="top-cuisine">${escHtml(r.cuisine||'')}</div>
          ${r.feature ? `<div class="top-feature">${escHtml(r.feature)}</div>` : ''}
          <div class="top-meta">
            ${r.price ? `<span>💰 ${escHtml(r.price)}</span>` : ''}
            ${r.distance ? `<span>${distIcon(r.distance)} ${escHtml(r.distance)}</span>` : ''}
            ${r.verified === false ? `<span style="color:#c05">🚫 지도없음</span>` : ''}
          </div>
        </div>
      </div>`).join('') : '<div style="color:#ccc;font-size:0.82rem;padding:10px 0">아직 평가한 맛집이 없습니다.</div>'}
    </div>`;
}

// ── 내 주변 맛집 ──────────────────────────────────────────────
let searchedPlaces = [];   // [{name, cuisine, distance, address, verified}]
let placeSearchQ = '';     // 이름 검색어 (없으면 주변 목록 모드)
let placeSearchBusy = false;
let placeOrigin = '';      // '현위치' | 'JB빌딩'
let myPos = null;          // {lat, lng} (한 번 받으면 캐시)
let nearbyLoaded = false;  // 리뷰 탭 첫 진입 시 1회 자동 로드

// 브라우저 GPS 위치 (권한 거부/실패 시 null → JB빌딩 폴백)
function getMyPosition() {
  return new Promise(resolve => {
    if (myPos) { resolve(myPos); return; }
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p => { myPos = { lat: p.coords.latitude, lng: p.coords.longitude }; resolve(myPos); },
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 7000, maximumAge: 300000 }
    );
  });
}

function renderPlaceResults() {
  if (placeSearchBusy) return '<div class="place-hint">📍 주변 맛집 불러오는 중…</div>';
  // 아직 안 불러왔고 검색도 안 했으면 → 버튼 노출
  if (!nearbyLoaded && !placeSearchQ) {
    return `<button class="place-nearby-btn" onclick="loadNearby(true)">📍 내 주변 맛집 보기</button>
      <div class="place-hint" style="text-align:center">버튼을 누르면 내 위치 주변 맛집을 보여드려요. (위치 허용 권장)</div>`;
  }
  if (!searchedPlaces.length) {
    return placeSearchQ
      ? '<div class="place-hint">검색 결과가 없어요. 다른 이름으로 시도해보세요.</div>'
      : '<div class="place-hint">주변 맛집을 불러오지 못했어요. 🔄 새로고침 또는 이름으로 검색해보세요.</div>';
  }
  const base = placeOrigin === '현위치' ? '현재 내 위치' : (placeOrigin || LOC().short);
  const originNote = placeSearchQ
    ? `<div class="place-origin">🔎 "${escHtml(placeSearchQ)}" 검색 · ${base} 기준 · 카카오+네이버</div>`
    : `<div class="place-origin">📍 ${base} 주변 맛집 · 가까운 순 · 카카오+네이버</div>`;
  const SRC_CLS = { '카카오': 'src-kakao', '네이버': 'src-naver' };
  return originNote + searchedPlaces.map(p => {
    const cms = commentsState[p.name] || [];
    const cnt = cms.length;
    const srcBadge = p.source ? `<span class="src-badge ${SRC_CLS[p.source]||''}">${escHtml(p.source)}</span>` : '';
    return `<div class="place-item">
      <div class="place-info" onclick="openModal('${escAttr(p.name)}','')">
        <div class="place-name">${emo(p.cuisine)} ${escHtml(p.name)} ${srcBadge} ${cnt?`<span class="badge badge-review">리뷰 ${cnt}</span>`:''}</div>
        <div class="place-sub">${escHtml(p.cuisine||'')} · ${distIcon(p.distance)} ${escHtml(p.distance||'')}</div>
        ${p.address?`<div class="place-addr">📍 ${escHtml(p.address)}</div>`:''}
      </div>
      <button class="place-review-btn" onclick="openModal('${escAttr(p.name)}','')">📝 리뷰</button>
    </div>`;
  }).join('');
}

// 공통 조회: query 없으면 주변 목록, 있으면 이름 검색
async function fetchPlaces(query) {
  track(query ? 'place_search' : 'nearby', query || '');
  placeSearchBusy = true;
  nearbyLoaded = true;
  const rwrap = document.getElementById('place-results');
  if (rwrap) rwrap.innerHTML = renderPlaceResults();
  const pos = await getMyPosition();   // 허용 시 내 위치, 거부 시 선택 거점 폴백
  try {
    const reqBody = {};
    if (query) reqBody.query = query;
    // GPS 허용 시 실제 내 위치, 아니면 선택한 기준 위치(JB/광주/전북) 좌표
    const ctr = pos || { lat: LOC().lat, lng: LOC().lng };
    reqBody.lat = ctr.lat; reqBody.lng = ctr.lng;
    const res = await fetch(PLACES_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(reqBody)
    });
    const data = await res.json();
    searchedPlaces = Array.isArray(data.places) ? data.places : [];
    cachePlaces(searchedPlaces);
    placeOrigin = pos ? '현위치' : LOC().short;
  } catch (e) {
    searchedPlaces = [];
  }
  placeSearchBusy = false;
  renderStats();
}

// 내 주변 맛집 자동 목록 (검색어 없이)
async function loadNearby(force) {
  if (nearbyLoaded && !force) return;
  placeSearchQ = '';
  await fetchPlaces('');
}

// 주변 맛집 리스트 닫기 — 초기 상태로 복귀
function closeNearby() {
  nearbyLoaded = false;
  placeSearchQ = '';
  searchedPlaces = [];
  renderStats();
}

// ── 내 위치 주변 맛집 (홈 탭 · 하이브리드: 빠른 근처목록 → 컨디션 큐레이션) ──
function setNearbyResult(origin, restaurants, extras, comment, curating) {
  const mark = arr => (arr || []).map(p => ({ ...p, _nearby: true }));
  const rs = mark(restaurants), ex = mark(extras);
  cachePlaces([...rs, ...ex]);   // 좌표·정보 캐시 → 카드·경로 버튼 동작
  customResult = { label: `📍 ${origin}`, comment: comment || '', restaurants: rs, extras: ex, kind: 'nearby' };
  const answerEl = document.getElementById('pref-answer');
  if (answerEl) {
    answerEl.innerHTML = curating
      ? `<div class="pa-head">📍 ${escHtml(origin)} · 가까운 순</div>가까운 순으로 먼저 보여드려요. <span style="color:#3182ce">맞춤 추천 준비 중…</span>`
      : `<div class="pa-head">📍 ${escHtml(origin)} 맞춤 추천</div>${comment ? escHtml(comment) : '현재 위치 기준으로 골랐어요.'}`;
    answerEl.classList.add('show');
  }
  renderCustomGroup();
}
async function loadHomeNearby() {
  const progEl = document.getElementById('pref-progress');
  const fill = document.getElementById('pref-progress-fill');
  const progText = document.getElementById('pref-progress-text');
  const answerEl = document.getElementById('pref-answer');
  if (answerEl) answerEl.classList.remove('show');
  if (progEl) { progEl.classList.add('show'); fill.style.width = '20%'; progText.textContent = '📍 내 위치 확인 중…'; }
  const pos = await getMyPosition();   // 거부/실패 시 선택 거점 폴백
  if (!locMode) { if (progEl) progEl.classList.remove('show'); return; }
  const ctr = pos || { lat: LOC().lat, lng: LOC().lng };
  const origin = pos ? '내 위치 주변' : `${LOC().short} 주변`;
  track('home_nearby', origin);
  if (progEl) { fill.style.width = '45%'; progText.textContent = '주변 맛집 불러오는 중…'; }

  const hdr = { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };
  // 두 호출 동시 시작: 빠른 근처목록(places-search) + 컨디션 큐레이션(analyze, GPS 좌표)
  const fastP = fetch(PLACES_URL, { method: 'POST', headers: hdr, body: JSON.stringify({ lat: ctr.lat, lng: ctr.lng }) }).then(r => r.json()).catch(() => null);
  const conds = currentConds.length ? currentConds.join(', ') : '';
  const curP = fetch(ANALYZE_URL, { method: 'POST', headers: hdr, body: JSON.stringify({ text: conds, meal: currentMeal, lat: ctr.lat, lng: ctr.lng, region: LOC().region, place: '내 위치 주변', profile: 'auto', custom: null }) }).then(r => r.json()).catch(() => null);

  // Phase 1: 빠른 근처목록 (~2초) — 즉각 반응
  const fd = await fastP;
  if (!locMode) { if (progEl) progEl.classList.remove('show'); return; }
  const fast = (fd && Array.isArray(fd.places)) ? fd.places : [];
  if (fast.length) {
    if (progEl) { fill.style.width = '70%'; progText.textContent = '맞춤 추천 선별 중…'; }
    setNearbyResult(origin, fast, [], '', true);
  }

  // Phase 2: 컨디션 큐레이션 5곳 (~15초) — 완성되면 교체
  const cd = await curP;
  if (progEl) { fill.style.width = '100%'; progText.textContent = '완료!'; setTimeout(() => progEl.classList.remove('show'), 300); }
  if (!locMode) return;
  const curated = (cd && Array.isArray(cd.restaurants)) ? cd.restaurants : [];
  if (curated.length) {
    setNearbyResult(origin, curated, Array.isArray(cd.extras) ? cd.extras : [], cd.comment || '', false);
  } else if (fast.length) {
    setNearbyResult(origin, fast, [], '', false);   // 큐레이션 실패 → 빠른목록 유지(준비중 표시 제거)
  } else if (answerEl) {
    answerEl.innerHTML = `<div class="pa-head">📍 ${escHtml(origin)}</div>주변 맛집을 못 찾았어요. 위치 권한을 확인해 주세요.`;
    answerEl.classList.add('show');
  }
}

// 이름으로 특정 가게 검색
async function searchPlaces() {
  const inp = document.getElementById('place-q');
  if (!inp) return;
  const q = inp.value.trim();
  placeSearchQ = q;
  if (!q) { await loadNearby(true); return; }   // 비우고 검색 = 주변 목록
  await fetchPlaces(q);
}

// ── 탭 전환 ───────────────────────────────────────────────────
function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ── 초기화 ────────────────────────────────────────────────────
init();
</script>
</body>
</html>
