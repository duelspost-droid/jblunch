<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ 여의나루 점심 맛집 트래커</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #f5f6fa;
    color: #1a1a2e;
    min-height: 100vh;
  }
  .app-header {
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 14px 18px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .app-header .logo { font-size: 1.5rem; }
  .app-header .title-block h1 { font-size: 1.05rem; font-weight: 700; }
  .app-header .title-block p { font-size: 0.76rem; color: #999; margin-top: 1px; }
  .sync-badge {
    margin-left: auto;
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }
  .sync-badge.ok { background: #c6f6d5; color: #22543d; }
  .sync-badge.loading { background: #ebf8ff; color: #2b6cb0; }
  .sync-badge.err { background: #fff5f5; color: #c53030; }

  .tabs {
    display: flex;
    background: #fff;
    border-bottom: 1px solid #eee;
    padding: 0 16px;
  }
  .tab {
    padding: 11px 16px;
    border: none;
    background: none;
    font-size: 0.86rem;
    font-weight: 500;
    color: #aaa;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }
  .tab.active { color: #e85d04; border-bottom-color: #e85d04; }

  .content { padding: 14px; max-width: 640px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }

  .sub-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .sub-tab {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid #e2e8f0;
    background: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    color: #aaa;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sub-tab.active { background: #e85d04; border-color: #e85d04; color: #fff; }

  .date-group { margin-bottom: 22px; }
  .date-label {
    font-size: 0.74rem;
    font-weight: 700;
    color: #999;
    letter-spacing: 0.05em;
    margin-bottom: 9px;
  }
  .weather-comment {
    background: linear-gradient(135deg, #fff9f0, #fff3e0);
    border-left: 3px solid #e85d04;
    border-radius: 10px;
    padding: 10px 13px;
    margin-bottom: 10px;
    font-size: 0.82rem;
    color: #555;
    line-height: 1.5;
  }
  .cards { display: flex; flex-direction: column; gap: 9px; }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 13px 13px 13px 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    gap: 0;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .card:hover { box-shadow: 0 3px 14px rgba(0,0,0,0.1); }
  .card-stripe {
    width: 4px;
    flex-shrink: 0;
    background: #e2e8f0;
    margin-right: 11px;
  }
  .card.visited .card-stripe { background: #48bb78; }

  .card-emoji { font-size: 1.6rem; flex-shrink: 0; margin-right: 9px; align-self: flex-start; padding-top: 2px; }
  .card-body { flex: 1; min-width: 0; }
  .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .card-name { font-weight: 700; font-size: 0.95rem; }
  .badge { font-size: 0.67rem; padding: 2px 7px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .badge-cuisine { background: #ebf4ff; color: #2b6cb0; }
  .badge-visited { background: #c6f6d5; color: #22543d; }
  .badge-unvisited { background: #f7fafc; color: #a0aec0; border: 1px solid #e2e8f0; }

  .card-feature { font-size: 0.81rem; color: #555; margin-bottom: 6px; line-height: 1.5; }
  .card-meta { display: flex; gap: 11px; font-size: 0.75rem; color: #999; flex-wrap: wrap; }

  /* 다중 리뷰 블록 */
  .reviews-block {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f3f3f3;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .review-item {
    background: #fafafa;
    border-radius: 9px;
    padding: 8px 10px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    position: relative;
  }
  .review-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #e85d04;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .review-right { flex: 1; min-width: 0; }
  .review-header { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; flex-wrap: wrap; }
  .review-name { font-size: 0.8rem; font-weight: 700; color: #333; }
  .review-stars { font-size: 0.75rem; }
  .review-date { font-size: 0.68rem; color: #bbb; }
  .review-content { font-size: 0.8rem; color: #555; line-height: 1.5; }
  .btn-del-review {
    background: none;
    border: none;
    cursor: pointer;
    color: #ccc;
    font-size: 0.85rem;
    padding: 2px 4px;
    border-radius: 4px;
    flex-shrink: 0;
    transition: color 0.13s, background 0.13s;
    line-height: 1;
  }
  .btn-del-review:hover { color: #e53e3e; background: #fff0f0; }
  .no-reviews { font-size: 0.76rem; color: #ccc; padding: 2px 0; }

  .card-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    flex-shrink: 0;
    padding-left: 9px;
    align-self: flex-start;
    padding-top: 2px;
  }
  .btn-visit, .btn-review {
    font-size: 0.71rem;
    padding: 5px 9px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
    transition: all 0.13s;
  }
  .btn-visit { border: 1.5px solid #48bb78; background: #fff; color: #48bb78; }
  .btn-visit:hover, .btn-visit.on { background: #48bb78; color: #fff; }
  .btn-review { border: 1.5px solid #e85d04; background: #fff; color: #e85d04; }
  .btn-review:hover { background: #e85d04; color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  @media(min-width:400px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-num { font-size: 1.8rem; font-weight: 800; color: #e85d04; line-height: 1; }
  .stat-label { font-size: 0.72rem; color: #999; margin-top: 4px; }

  .top-list { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .top-list h3 { font-size: 0.88rem; font-weight: 700; margin-bottom: 11px; }
  .top-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f5f5f5; }
  .top-item:last-child { border-bottom: none; }
  .top-rank { font-size: 0.95rem; font-weight: 800; color: #e85d04; width: 20px; text-align: center; }
  .top-info { flex: 1; }
  .top-name { font-weight: 600; font-size: 0.86rem; }
  .top-cuisine { font-size: 0.73rem; color: #aaa; }
  .top-stars { font-size: 0.82rem; }

  .skeleton { background: #eee; border-radius: 8px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* 리뷰 작성 모달 */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  @media(min-width:480px) { .modal-bg { align-items: center; } }
  .modal {
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 22px 18px;
    width: 100%;
    max-width: 460px;
  }
  @media(min-width:480px) { .modal { border-radius: 18px; } }
  .modal h3 { font-size: 0.98rem; font-weight: 700; margin-bottom: 14px; }
  .modal-field { margin-bottom: 11px; }
  .modal-field label { font-size: 0.78rem; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
  .modal-field input[type="text"] {
    width: 100%;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 9px 11px; font-size: 0.86rem;
    font-family: inherit; color: #333;
  }
  .modal-field input[type="text"]:focus { outline: none; border-color: #e85d04; }
  .modal-stars { display: flex; gap: 8px; font-size: 1.8rem; cursor: pointer; }
  .modal-stars span { opacity: 0.22; transition: opacity 0.1s; }
  .modal-stars span.lit { opacity: 1; }
  .modal textarea {
    width: 100%; height: 80px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 9px 11px; font-size: 0.86rem; resize: none;
    font-family: inherit; color: #333; line-height: 1.5;
  }
  .modal textarea:focus { outline: none; border-color: #e85d04; }
  .modal-btns { display: flex; gap: 8px; margin-top: 11px; justify-content: flex-end; }
  .btn-cancel { background: #f5f5f5; color: #666; border: none; padding: 9px 16px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 0.86rem; }
  .btn-save { background: #e85d04; color: #fff; border: none; padding: 9px 16px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 0.86rem; }
  .saving-msg { font-size: 0.8rem; color: #888; margin-top: 8px; text-align: right; min-height: 18px; }

  .empty { text-align:center; padding:44px 20px; color:#ccc; font-size:0.86rem; }

  /* 삭제 확인 토스트 */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1a2e; color: #fff;
    padding: 10px 18px; border-radius: 12px;
    font-size: 0.83rem; font-weight: 500;
    z-index: 100; display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    white-space: nowrap;
  }
  .toast.show { display: block; animation: fadeInUp 0.2s ease; }
  @keyframes fadeInUp { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* 컨디션 입력 */
  .pref-card {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    margin-bottom: 14px;
  }
  .pref-title { font-size: 0.82rem; font-weight: 700; color: #333; margin-bottom: 10px; }
  .pref-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .pref-chip {
    padding: 5px 12px; border-radius: 20px;
    border: 1.5px solid #e2e8f0; background: #fff;
    font-size: 0.76rem; font-weight: 600; color: #888;
    cursor: pointer; transition: all 0.13s;
  }
  .pref-chip.on { border-color: #e85d04; background: #e85d04; color: #fff; }
  .pref-input-row { display: flex; gap: 8px; }
  .pref-input {
    flex: 1; border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 8px 11px; font-size: 0.84rem; font-family: inherit; color: #333;
  }
  .pref-input:focus { outline: none; border-color: #e85d04; }
  .pref-submit {
    background: #e85d04; color: #fff; border: none;
    border-radius: 10px; padding: 8px 14px;
    font-size: 0.82rem; font-weight: 700; cursor: pointer;
    white-space: nowrap;
  }
  .pref-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .pref-saved { font-size: 0.76rem; color: #48bb78; margin-top: 7px; min-height: 16px; }

  /* 진행 프로그래스 + 답변 코멘트 */
  .pref-progress {
    margin-top: 10px;
    display: none;
  }
  .pref-progress.show { display: block; }
  .pref-progress-label {
    font-size: 0.78rem; color: #e85d04; font-weight: 600;
    margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .pref-progress-bar {
    height: 6px; background: #f0f0f0; border-radius: 6px; overflow: hidden;
  }
  .pref-progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #e85d04, #f6a04d);
    border-radius: 6px; transition: width 0.25s ease;
  }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid #f6cdae; border-top-color: #e85d04;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pref-answer {
    margin-top: 11px; padding: 11px 13px;
    background: linear-gradient(135deg, #fff7f0, #fff1e6);
    border: 1px solid #ffd9b3; border-radius: 12px;
    font-size: 0.83rem; color: #5a4030; line-height: 1.55;
    display: none; animation: fadeInUp 0.25s ease;
  }
  .pref-answer.show { display: block; }
  .pref-answer .pa-head { font-weight: 700; color: #e85d04; margin-bottom: 3px; }

  /* 검색 히스토리 */
  .pref-history {
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px dashed #eee;
  }
  .pref-history-head {
    font-size: 0.72rem; color: #aaa; font-weight: 600;
    margin-bottom: 7px; display: flex; align-items: center; justify-content: space-between;
  }
  .pref-history-clear {
    background: none; border: none; color: #ccc; cursor: pointer;
    font-size: 0.7rem; padding: 0;
  }
  .pref-history-clear:hover { color: #e53e3e; }
  .pref-history-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .hist-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 16px;
    background: #f7f7f9; border: 1px solid #ececf0;
    font-size: 0.74rem; color: #555; cursor: pointer;
    transition: all 0.13s; max-width: 200px;
  }
  .hist-chip:hover { background: #fff3e6; border-color: #ffd1a3; color: #e85d04; }
  .hist-chip .hc-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-chip .hc-cond { font-size: 0.68rem; color: #aaa; flex-shrink: 0; }
</style>
</head>

    <div class="saving-msg" id="saving-msg"></div>

      <button class="btn-save" id="btn-save" onclick="saveReview()">저장</button>

  </div>
</div>

<div class="toast" id="toast"></div>

  try {
    // 방문 여부
    const r1 = await fetch(`${SB_URL}/rest/v1/reviews?select=id,visited`, { headers: SB_HEADERS });

    visits.forEach(v => { visitState[v.id] = v.visited; });

    // 댓글 (다중 리뷰)
    const r2 = await fetch(`${SB_URL}/rest/v1/comments?select=*&order=created_at.asc`, { headers: SB_HEADERS });
    if (!r2.ok) throw new Error(r2.status);
    const comments = await r2.json();
    commentsState = {};
    comments.forEach(c => {
      if (!commentsState[c.restaurant_id]) commentsState[c.restaurant_id] = [];
      commentsState[c.restaurant_id].push(c);
    });

    setBadge('ok', '☁️ 동기화됨');
  } catch(e) {
    setBadge('err', '⚠️ 오프라인');
  }
  renderHistory();
  renderStats();
}

async function upsertVisit(id, visited) {
  const res = await fetch(`${SB_URL}/rest/v1/reviews`, {
    method: 'POST',
    headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates' },
    body: JSON.stringify({ id, visited, updated_at: new Date().toISOString() })
  });
  if (!res.ok) throw new Error(await res.text());
}

async function insertComment(restaurantId, reviewerName, content, rating) {
  const body = {
    restaurant_id: restaurantId,
    reviewer_name: reviewerName,
    content: content || null,
    rating: rating || null,
    created_at: new Date().toISOString()
  };
  const res = await fetch(`${SB_URL}/rest/v1/comments`, {
    method: 'POST',
    headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text());
  const rows = await res.json();
  return rows[0];
}

async function deleteComment(commentId) {
  const res = await fetch(`${SB_URL}/rest/v1/comments?id=eq.${commentId}`, {
    method: 'DELETE',
    headers: SB_HEADERS
  });
  if (!res.ok) throw new Error(await res.text());
}

function setBadge(type, text) {
  const b = document.getElementById('sync-badge');
  b.className = 'sync-badge ' + type;
  b.textContent = text;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── 이모지 ────────────────────────────────────────────────────
function emo(c) {
  if (!c) return '🍽️';
  if (c.includes('일식')) return '🍜';
  if (c.includes('한식')) return '🍲';
  if (c.includes('중식')) return '🥢';
  if (c.includes('버거')) return '🍔';
  return '🍽️';
}

function avatarColor(name) {
  const colors = ['#e85d04','#3182ce','#38a169','#805ad5','#d69e2e','#e53e3e','#319795'];
  let h = 0;
  for (let i=0; i<name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
  return colors[Math.abs(h) % colors.length];
}

function starsHtml(rating) {
  if (!rating) return '';
  return '⭐'.repeat(rating) + '<span style="opacity:0.3">☆</span>'.repeat(5 - rating);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ── 카드 그룹 렌더 (공통) ────────────────────────────────────
function renderGroup(group) {
  const d = new Date(group.date);
  const days = ['일','월','화','수','목','금','토'];
  const label = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  const cards = group.restaurants.map(r => {
    const visited = !!visitState[r.id];
    const cms = commentsState[r.id] || [];
    const reviewsHtml = cms.length
      ? cms.map(c => {
          const initial = (c.reviewer_name||'?').charAt(0).toUpperCase();
          const color = avatarColor(c.reviewer_name||'?');
          return `<div class="review-item">
            <div class="review-avatar" style="background:${color}">${initial}</div>
            <div class="review-right">
              <div class="review-header">
                <span class="review-name">${escHtml(c.reviewer_name)}</span>
                ${c.rating ? `<span class="review-stars">${starsHtml(c.rating)}</span>` : ''}
                <span class="review-date">${fmtDate(c.created_at)}</span>
              </div>
              ${c.content ? `<div class="review-content">${escHtml(c.content)}</div>` : ''}
            </div>
            <button class="btn-del-review" title="삭제" onclick="confirmDelete('${c.id}','${r.id}')">✕</button>
          </div>`;
        }).join('')
      : '<div class="no-reviews">아직 리뷰가 없습니다.</div>';
    return `<div class="card ${visited?'visited':''}" id="c-${r.id}">
      <div class="card-stripe"></div>
      <div class="card-emoji">${emo(r.cuisine)}</div>
      <div class="card-body">
        <div class="card-top">
          <span class="card-name">${r.name}</span>
          <span class="badge badge-cuisine">${r.cuisine}</span>
          <span class="badge ${visited?'badge-visited':'badge-unvisited'}">${visited?'✅ 방문함':'미방문'}</span>
        </div>
        <div class="card-feature">${r.feature}</div>
        <div class="card-meta">
          <span>💰 ${r.price}</span>
          <span>🚶 ${r.distance}</span>
        </div>
        <div class="reviews-block">${reviewsHtml}</div>
      </div>
      <div class="card-actions">
        <button class="btn-visit ${visited?'on':''}" onclick="toggleVisit('${r.id}')">${visited?'✅ 방문':'방문 체크'}</button>
        <button class="btn-review" onclick="openModal('${r.id}','${escAttr(r.name)}')">📝 리뷰</button>
      </div>
    </div>`;
  }).join('');
  const commentHtml = group.comment
    ? `<div class="weather-comment">🌤️ ${escHtml(group.comment)}</div>`
    : '';
  return `<div class="date-group">
    <div class="date-label">📅 ${label}</div>
    ${commentHtml}
    <div class="cards">${cards}</div>
  </div>`;
}

let currentCond = '';  // 선택된 컨디션 ('': 기본)

// 자유 입력 → 컨디션 키워드 매핑 (고정 도출)
const COND_KEYWORDS = {
  '해장 필요': ['해장','과음','술','숙취','국물','뜨끈','속풀','얼큰한국'],
  '매콤하게': ['매콤','매운','얼큰','맵','칼칼','마라','떡볶','스트레스'],
  '가볍게': ['가볍','가벼','샐러드','브런치','커피','간단','다이어','적게','속편'],
  '든든하게': ['든든','배고','많이','푸짐','포만','고기많','양많','배불'],
  '일식': ['일식','초밥','스시','소바','돈카츠','라멘','우동','회'],
  '한식': ['한식','국밥','찌개','백반','집밥','한정식','김치'],
  '고기': ['고기','삼겹','구이','한우','스테이크','갈비','회식','육'],
  '혼밥': ['혼밥','혼자','빨리','빠르','간편','대기싫','웨이팅싫','후딱'],
};

// 컨디션별 답변 코멘트
const COND_ANSWERS = {
  '해장 필요': { emoji:'🍜', head:'해장이 필요하시군요!', body:'속을 따뜻하게 풀어줄 국물 요리 위주로 골라봤어요. 뜨끈한 국밥 한 그릇 어떠세요?' },
  '매콤하게': { emoji:'🌶️', head:'매콤한 게 당기시네요!', body:'스트레스엔 역시 매운맛이죠. 얼큰하고 칼칼한 메뉴로 추천드려요.' },
  '가볍게': { emoji:'🥗', head:'가볍게 드시고 싶으시군요!', body:'부담 없이 즐길 수 있는 산뜻한 메뉴 위주로 준비했어요.' },
  '든든하게': { emoji:'🍖', head:'든든하게 채우고 싶으시죠!', body:'배부르게 먹을 수 있는 푸짐한 메뉴로 골라봤어요. 오후도 힘내세요!' },
  '일식': { emoji:'🍣', head:'일식 기분이시네요!', body:'정갈한 일식 맛집들로 추천드려요. 소바부터 돈카츠까지 골라보세요.' },
  '한식': { emoji:'🍚', head:'역시 한식이죠!', body:'든든한 집밥 같은 한식 맛집으로 준비했어요.' },
  '고기': { emoji:'🥩', head:'고기가 당기시는군요!', body:'육즙 가득한 고기 맛집으로 추천드려요. 점심부터 든든하게!' },
  '혼밥': { emoji:'🚶', head:'혼밥 모드시네요!', body:'빠르고 편하게 먹기 좋은, 혼자서도 부담 없는 곳들로 골랐어요.' },
};

function matchCondition(text) {
  const t = text.replace(/\s/g, '');
  let best = '', bestScore = 0;
  for (const [cond, kws] of Object.entries(COND_KEYWORDS)) {
    let score = 0;
    for (const kw of kws) if (t.includes(kw)) score++;
    if (score > bestScore) { bestScore = score; best = cond; }
  }
  return bestScore > 0 ? best : '';
}

const ANALYZE_URL = `${SB_URL}/functions/v1/analyze`;
const COND_EMOJI = {'해장 필요':'🍜','매콤하게':'🌶️','가볍게':'🥗','든든하게':'🍖','일식':'🍣','한식':'🍚','고기':'🥩','혼밥':'🚶'};

// ── 검색 히스토리 (localStorage) ─────────────────────────────
const HIST_KEY = 'jblunch_search_history';
const HIST_MAX = 8;

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
}
function addHistory(text, cond) {
  let h = getHistory().filter(x => x.text !== text);  // 중복 제거
  h.unshift({ text, cond, ts: Date.now() });
  h = h.slice(0, HIST_MAX);
  localStorage.setItem(HIST_KEY, JSON.stringify(h));
  renderSearchHistory();
}
function clearHistory() {
  localStorage.removeItem(HIST_KEY);
  renderSearchHistory();
}
function renderSearchHistory() {
  const wrap = document.getElementById('pref-history');
  const chips = document.getElementById('pref-history-chips');
  if (!wrap || !chips) return;
  const h = getHistory();
  if (!h.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  chips.innerHTML = h.map(item => {
    const emoji = COND_EMOJI[item.cond] || '🍽️';
    return `<button class="hist-chip" onclick="rerunHistory('${escAttr(item.text)}')">
      <span class="hc-text">${escHtml(item.text)}</span>
      <span class="hc-cond">${emoji}${item.cond ? ' ' + escHtml(item.cond) : ''}</span>
    </button>`;
  }).join('');
}
function rerunHistory(text) {
  const input = document.getElementById('pref-text');
  if (input) input.value = text;
  applyFreeText();
}

async function applyFreeText() {
  const input = document.getElementById('pref-text');
  const text = input.value.trim();
  const answerEl = document.getElementById('pref-answer');
  const progEl = document.getElementById('pref-progress');
  const fill = document.getElementById('pref-progress-fill');
  const progText = document.getElementById('pref-progress-text');
  const btn = document.getElementById('pref-btn');
  if (!text) return;

  answerEl.classList.remove('show');
  btn.disabled = true;
  progEl.classList.add('show');
  fill.style.width = '0%';

  // 프로그래스 애니메이션 (AI 응답 대기 동안)
  const steps = [
    { t: '입력 분석 중…', w: 30 },
    { t: 'AI가 컨디션 파악 중…', w: 60 },
    { t: '맞춤 맛집 선별 중…', w: 85 },
  ];
  let i = 0;
  let progTimer = setInterval(() => {
    if (i < steps.length) {
      progText.textContent = steps[i].t;
      fill.style.width = steps[i].w + '%';
      i++;
    }
  }, 400);

  let cond = '', comment = '';
  try {
    const res = await fetch(ANALYZE_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    cond = data.condition || '';
    comment = data.comment || '';
  } catch (e) {
    // 실패 시 키워드 매칭 폴백
    cond = matchCondition(text);
  }

  clearInterval(progTimer);
  fill.style.width = '100%';
  progText.textContent = '완료!';

  setTimeout(() => {
    document.querySelectorAll('.pref-chip').forEach(c =>
      c.classList.toggle('on', c.dataset.cond === cond));
    currentCond = cond;

    const emoji = COND_EMOJI[cond] || '🍽️';
    if (cond) {
      const head = comment ? '' : `${cond} 추천`;
      answerEl.innerHTML = `<div class="pa-head">${emoji} ${cond}</div>${escHtml(comment || COND_ANSWERS[cond]?.body || '')}`;
    } else {
      answerEl.innerHTML = `<div class="pa-head">🍽️ 오늘의 기본 추천</div>${escHtml(comment || '입력에 딱 맞는 분류를 찾지 못해 기본 추천을 보여드려요.')}`;
    }

    progEl.classList.remove('show');
    answerEl.classList.add('show');
    btn.disabled = false;
    renderCondGroup();
    addHistory(text, cond);  // 검색 기록 저장
  }, 300);
}

function selectCond(el) {
  document.querySelectorAll('.pref-chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  currentCond = el.dataset.cond;
  const input = document.getElementById('pref-text');
  const answerEl = document.getElementById('pref-answer');
  const progEl = document.getElementById('pref-progress');
  if (input) input.value = '';
  if (answerEl) answerEl.classList.remove('show');
  if (progEl) progEl.classList.remove('show');
  renderCondGroup();
}

function renderCondGroup() {
  const sorted = [...HISTORY_DATA].sort((a,b) => b.date.localeCompare(a.date));
  if (!sorted.length) return;
  // by_condition 있는 가장 최근 항목 우선 사용
  const group = sorted.find(g => g.by_condition) || sorted[0];
  const restaurants = currentCond && group.by_condition?.[currentCond]
    ? group.by_condition[currentCond]
    : group.restaurants;
  const target = {...group, restaurants};
  document.getElementById('today-group').innerHTML = renderGroup(target);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,"\\'");
}

// ── 방문 토글 ─────────────────────────────────────────────────
async function toggleVisit(id) {
  visitState[id] = !visitState[id];
  renderHistory(); renderStats();
  setBadge('loading', '저장 중…');
  try {
    await upsertVisit(id, visitState[id]);
    setBadge('ok', '☁️ 동기화됨');
  } catch {
    setBadge('err', '⚠️ 저장 실패');
  }
}

// ── 리뷰 모달 ─────────────────────────────────────────────────
let mId = null, mRating = 0;

function openModal(id, name) {
  mId = id; mRating = 0;
  document.getElementById('modal-title').textContent = `📝 ${name} 리뷰 남기기`;
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-text').value = '';
  document.getElementById('saving-msg').textContent = '';
  document.getElementById('btn-save').disabled = false;
  renderModalStars();
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 100);
}
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); mId = null; }

function renderModalStars() {
  document.querySelectorAll('#modal-stars span').forEach(s => {
    s.classList.toggle('lit', parseInt(s.dataset.v) <= mRating);
  });
}
document.querySelectorAll('#modal-stars span').forEach(s => {
  s.addEventListener('click', () => { mRating = parseInt(s.dataset.v); renderModalStars(); });
});
document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

async function saveReview() {
  if (!mId) return;
  const name = document.getElementById('modal-name').value.trim();
  const text = document.getElementById('modal-text').value.trim();
  if (!name) {
    document.getElementById('saving-msg').textContent = '⚠️ 이름을 입력해주세요.';
    document.getElementById('modal-name').focus();
    return;
  }
  if (!text && !mRating) {
    document.getElementById('saving-msg').textContent = '⚠️ 별점 또는 리뷰 내용을 입력해주세요.';
    return;
  }

  const btn = document.getElementById('btn-save');
  const msg = document.getElementById('saving-msg');
  btn.disabled = true;
  msg.textContent = '저장 중…';

  try {
    const newComment = await insertComment(mId, name, text, mRating);
    if (!commentsState[mId]) commentsState[mId] = [];
    commentsState[mId].push(newComment);
    // 리뷰 남기면 방문 체크도 자동
    if (!visitState[mId]) {
      visitState[mId] = true;
      await upsertVisit(mId, true);
    }
    setBadge('ok', '☁️ 동기화됨');
    closeModal();
    renderHistory(); renderStats();
    showToast('✅ 리뷰가 저장되었습니다!');
  } catch(e) {
    msg.textContent = '⚠️ 저장 실패. 다시 시도해주세요.';
    btn.disabled = false;
    setBadge('err', '⚠️ 저장 실패');
  }
}

// ── 리뷰 삭제 ─────────────────────────────────────────────────
async function confirmDelete(commentId, restaurantId) {
  if (!confirm('이 리뷰를 삭제하시겠습니까?')) return;
  setBadge('loading', '삭제 중…');
  try {
    await deleteComment(commentId);
    if (commentsState[restaurantId]) {
      commentsState[restaurantId] = commentsState[restaurantId].filter(c => c.id !== commentId);
    }
    renderHistory(); renderStats();
    setBadge('ok', '☁️ 동기화됨');
    showToast('🗑️ 리뷰가 삭제되었습니다.');
  } catch {
    setBadge('err', '⚠️ 삭제 실패');
    showToast('⚠️ 삭제에 실패했습니다. 다시 시도해주세요.');
  }
}

// ── 통계 ──────────────────────────────────────────────────────
function renderStats() {
  const all = HISTORY_DATA.flatMap(g => g.restaurants);
  const visited = all.filter(r => visitState[r.id]).length;
  const allComments = Object.values(commentsState).flat();
  const reviewed = new Set(allComments.map(c => c.restaurant_id)).size;
  const ratings = allComments.map(c => c.rating).filter(Boolean);
  const avg = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '-';

  // TOP 맛집: 평균 별점 기준
  const ratingMap = {};
  allComments.forEach(c => {
    if (!c.rating) return;
    if (!ratingMap[c.restaurant_id]) ratingMap[c.restaurant_id] = [];
    ratingMap[c.restaurant_id].push(c.rating);
  });
  const topList = all
    .filter(r => ratingMap[r.id])
    .map(r => ({
      ...r,
      avg: ratingMap[r.id].reduce((a,b)=>a+b,0)/ratingMap[r.id].length,
      cnt: ratingMap[r.id].length
    }))
    .sort((a,b) => b.avg - a.avg).slice(0,5);

  const sorted = [...HISTORY_DATA].sort((a,b) => b.date.localeCompare(a.date));
  const statsHtml = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${all.length}</div><div class="stat-label">총 추천 수</div></div>
      <div class="stat-card"><div class="stat-num">${visited}</div><div class="stat-label">방문한 곳</div></div>
      <div class="stat-card"><div class="stat-num">${allComments.length}</div><div class="stat-label">총 리뷰 수</div></div>
      <div class="stat-card"><div class="stat-num">${avg}</div><div class="stat-label">평균 별점</div></div>
    </div>
    <div class="top-list">
      <h3>⭐ TOP 맛집 (평균 별점순)</h3>
      ${topList.length ? topList.map((r,i) => `<div class="top-item">
        <div class="top-rank">${i+1}</div>
        <div class="top-info">
          <div class="top-name">${emo(r.cuisine)} ${r.name}</div>
          <div class="top-cuisine">${r.cuisine} · 리뷰 ${r.cnt}개</div>
        </div>
        <div class="top-stars">${'⭐'.repeat(Math.round(r.avg))} <small style="color:#aaa">${r.avg.toFixed(1)}</small></div>
      </div>`).join('') : '<div style="color:#ccc;font-size:0.82rem;padding:10px 0">아직 평가한 맛집이 없습니다.</div>'}
    </div>`;

  const historyHtml = sorted.length > 1
    ? sorted.slice(1).map(g => renderGroup(g)).join('')
    : '<div class="empty">과거 이력이 없습니다.</div>';

  document.getElementById('tab-stats').innerHTML = `
    <div class="sub-tabs">
      <button class="sub-tab active" id="sub-stats-btn" onclick="showSubTab('sub-stats')">📊 통계</button>
      <button class="sub-tab" id="sub-history-btn" onclick="showSubTab('sub-history')">📋 과거 이력</button>
    </div>
    <div id="sub-stats">${statsHtml}</div>
    <div id="sub-history" style="display:none">${historyHtml}</div>`;
}

// ── 서브탭 전환 ───────────────────────────────────────────────
function showSubTab(name) {
  ['sub-stats', 'sub-history'].forEach(id => {
    const el = document.getElementById(id);
    const btn = document.getElementById(id + '-btn');
    if (el) el.style.display = id === name ? '' : 'none';
    if (btn) btn.classList.toggle('active', id === name);
  });
}

// ── 탭 전환 ───────────────────────────────────────────────────
function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ── 초기화 ────────────────────────────────────────────────────
loadAll();
</script>
</body>
